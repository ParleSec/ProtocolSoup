openapi: 3.1.0
info:
  title: ProtocolSoup VC API
  version: 1.0.0
  summary: OID4VCI and OID4VP service endpoints.
  description: |
    Public contract for the ProtocolSoup VC service.
    Includes issuer (OID4VCI) and verifier (OID4VP) protocol endpoints.
servers:
  - url: https://protocolsoup.com
    description: Production VC service
security: []
tags:
  - name: Health
    description: Service health and API index endpoints.
  - name: OID4VCI
    description: Credential issuance and token exchange endpoints.
  - name: OID4VP
    description: Request object and wallet response verification endpoints supporting redirect_uri, decentralized_identifier (did:web), verifier_attestation, and x509_san_dns client ID schemes.
paths:
  /health:
    get:
      tags: [Health]
      summary: Get service health
      operationId: getVcHealth
      responses:
        "200":
          description: Health payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api:
    get:
      tags: [Health]
      summary: Get API index
      operationId: getVcApiIndex
      responses:
        "200":
          description: API index payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndexResponse"
  /.well-known/openid-credential-issuer/oid4vci:
    get:
      tags: [OID4VCI]
      summary: Canonical issuer metadata path
      operationId: getVcIssuerMetadataCanonical
      responses:
        "200":
          description: Credential issuer metadata as JSON, or as a signed JWT when requested with Accept application/jwt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/jwt:
              schema:
                type: string
                description: Signed metadata JWT with typ openidvci-issuer-metadata+jwt and a leaf-first x5c chain excluding the trust anchor.
        "404":
          description: Metadata path not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/.well-known/openid-credential-issuer:
    get:
      tags: [OID4VCI]
      summary: OID4VCI issuer metadata
      operationId: getVcIssuerMetadata
      responses:
        "200":
          description: Credential issuer metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /.well-known/oauth-authorization-server/oid4vci:
    get:
      tags: [OID4VCI]
      summary: Canonical Authorization Server metadata path
      description: >
        RFC 8414 Authorization Server Metadata for the OID4VCI issuer,
        advertising authorization_endpoint and token_endpoint so a wallet can
        discover and drive the authorization_code grant.
        token_endpoint_auth_methods_supported includes attest_jwt_client_auth
        only when a client attestation trust anchor is configured on the
        deployment.
      operationId: getVcAuthorizationServerMetadataCanonical
      responses:
        "200":
          description: Authorization Server metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Metadata path not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/.well-known/oauth-authorization-server:
    get:
      tags: [OID4VCI]
      summary: OID4VCI Authorization Server metadata (plugin-local alias)
      operationId: getVcAuthorizationServerMetadata
      responses:
        "200":
          description: Authorization Server metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /oid4vci/credential-offer/{offerID}:
    get:
      tags: [OID4VCI]
      summary: Resolve by-reference credential offer
      operationId: getVcCredentialOffer
      parameters:
        - in: path
          name: offerID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Credential offer payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Offer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/offers/pre-authorized:
    post:
      tags: [OID4VCI]
      summary: Create pre-authorized offer (by-reference)
      description: >
        Creates a by-reference pre-authorized credential offer. When
        `credential_configuration_ids` is omitted, the offer defaults to the
        issuer's default and lead configuration, the ISO/IEC 18013-5 mobile
        driving licence (`MobileDrivingLicenceMsoMdoc`, `mso_mdoc`). To receive
        SD-JWT VC or a W3C format, name the configuration explicitly (for
        example `["UniversityDegreeCredential"]`). This implicit default changed
        from SD-JWT VC to mDL `mso_mdoc`; explicit selection is unchanged.
      operationId: createVcPreAuthorizedOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Offer creation response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid offer payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/offers/pre-authorized/by-value:
    post:
      tags: [OID4VCI]
      summary: Create pre-authorized offer (by-value)
      operationId: createVcPreAuthorizedOfferByValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Offer creation response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid offer payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/offers/pre-authorized/deferred:
    post:
      tags: [OID4VCI]
      summary: Create deferred-capable pre-authorized offer
      operationId: createVcDeferredOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Deferred offer creation response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid offer payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/offers/authorization-code:
    post:
      tags: [OID4VCI]
      summary: Create a tracked issuer-initiated authorization code offer
      description: >
        Creates an OpenID4VCI issuer-initiated Credential Offer containing an
        authorization_code grant and a fresh issuer_state. The issuer persists
        that processing context, validates it when returned in PAR, and exposes
        a separate opaque status_uri for observing real issuance milestones.
        When credential_offer_endpoint is supplied, the issuer also performs the
        OID4VCI §4.1.2 HTTPS GET that delivers credential_offer to that wallet
        endpoint.
      operationId: createVcAuthorizationCodeOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_configuration_ids]
              properties:
                credential_configuration_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                credential_offer_endpoint:
                  type: string
                  format: uri
                  description: >
                    Wallet Credential Offer Endpoint (OID4VCI §4.1.2). When present,
                    the issuer delivers the offer with a real HTTPS GET using the
                    credential_offer query parameter.
      responses:
        "201":
          description: Issuer-initiated offer and lifecycle status reference.
          content:
            application/json:
              schema:
                type: object
                required: [credential_issuer, credential_configuration_ids, issuer_state, credential_offer, status_uri, expires_in]
                properties:
                  credential_issuer:
                    type: string
                    format: uri
                  credential_configuration_ids:
                    type: array
                    items:
                      type: string
                  issuer_state:
                    type: string
                  credential_offer:
                    type: object
                    additionalProperties: true
                  status_uri:
                    type: string
                    format: uri
                  expires_in:
                    type: integer
                    minimum: 1
                  credential_offer_endpoint:
                    type: string
                    format: uri
                  credential_offer_delivery_url:
                    type: string
                    format: uri
                  credential_offer_delivered:
                    type: boolean
                  credential_offer_delivery_status:
                    type: integer
                    minimum: 100
                    maximum: 599
        "400":
          description: Invalid offer payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/offers/authorization-code/status/{statusID}:
    get:
      tags: [OID4VCI]
      summary: Read issuer-initiated issuance lifecycle status
      description: >
        Returns the server-observed lifecycle for the opaque status reference:
        waiting_for_wallet, authorization_request_received, token_issued,
        credential_issued, or expired. The issuer_state itself is not used as
        the status reference.
      operationId: getVcAuthorizationCodeOfferStatus
      parameters:
        - in: path
          name: statusID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current issuer-observed lifecycle state.
          content:
            application/json:
              schema:
                type: object
                required: [status, terminal, credential_configuration_ids, created_at, updated_at, expires_at]
                properties:
                  status:
                    type: string
                    enum: [waiting_for_wallet, authorization_request_received, token_issued, credential_issued, expired]
                  terminal:
                    type: boolean
                  credential_configuration_ids:
                    type: array
                    items:
                      type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
        "404":
          description: Status reference not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/token:
    post:
      tags: [OID4VCI]
      summary: Exchange grant for access token and nonce
      description: >
        Accepts grant_type=urn:ietf:params:oauth:grant-type:pre-authorized_code
        and grant_type=authorization_code (discoverable via
        /.well-known/oauth-authorization-server/oid4vci). Optionally accepts
        an OAuth-Client-Attestation + OAuth-Client-Attestation-PoP header pair
        (draft-ietf-oauth-attestation-based-client-auth) as an alternative to
        client_secret/Basic authentication; when either header is present it
        is the authentication verdict and a failure is never downgraded to a
        weaker method. Also optionally accepts a DPoP proof header (RFC 9449
        Section 4.3, htm=POST against this endpoint's URL); when present and
        valid, the issued access token is bound to the proof's key
        (cnf.jkt) and token_type becomes DPoP. Absent that header, behavior
        is unchanged Bearer issuance. If the deployment has DPoP nonce
        enforcement enabled for this endpoint, a proof lacking the current
        server nonce is rejected with use_dpop_nonce and a DPoP-Nonce
        response header instead.
      operationId: vcToken
      parameters:
        - in: header
          name: OAuth-Client-Attestation
          required: false
          schema:
            type: string
          description: Client Attestation JWT (typ=oauth-client-attestation+jwt). Requires the other attestation header when present.
        - in: header
          name: OAuth-Client-Attestation-PoP
          required: false
          schema:
            type: string
          description: Client Attestation Proof-of-Possession JWT (typ=oauth-client-attestation-pop+jwt), signed by the Client Instance Key in the attestation's cnf.jwk.
        - in: header
          name: DPoP
          required: false
          schema:
            type: string
          description: >-
            RFC 9449 DPoP proof JWT. Optional; when omitted, the issued
            access token is a plain Bearer token exactly as before DPoP
            existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Access token response.
          headers:
            DPoP-Nonce:
              schema:
                type: string
              description: >-
                Present only when this deployment has DPoP nonce
                enforcement enabled for this endpoint (off by default).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                token:
                  value:
                    access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    token_type: Bearer
                    expires_in: 600
                dpop_bound:
                  summary: DPoP-bound response (request carried a valid DPoP proof header)
                  value:
                    access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                    token_type: DPoP
                    expires_in: 600
        "400":
          description: >-
            Invalid grant or request, including invalid_dpop_proof (RFC
            9449 Section 5) and use_dpop_nonce (RFC 9449 Section 8, only
            when nonce enforcement is enabled for this endpoint).
          headers:
            DPoP-Nonce:
              schema:
                type: string
              description: Present when error is use_dpop_nonce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: Invalid, untrusted, or replayed client attestation, or unknown/mismatched client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: >-
            Server error, including failure of the shared DPoP proof replay
            store. The request fails closed and no token is issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/par:
    post:
      tags: [OID4VCI]
      summary: Push a HAIP authorization request
      description: >
        RFC 9126 PAR endpoint. Requires form encoding, OAuth client
        attestation headers, PKCE S256, exact client binding, and either
        openid_credential authorization_details or a supported VC scope. An
        optional DPoP proof is validated and retained when supplied; HAIP
        wallets may instead introduce DPoP at token redemption.
      operationId: vcPushAuthorizationRequest
      security: []
      parameters:
        - in: header
          name: OAuth-Client-Attestation
          required: true
          schema: {type: string}
        - in: header
          name: OAuth-Client-Attestation-PoP
          required: true
          schema: {type: string}
        - in: header
          name: DPoP
          required: false
          schema: {type: string}
          description: Optional RFC 9449 proof that pre-binds the authorization interaction to a DPoP key.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, redirect_uri, response_type, code_challenge, code_challenge_method]
              properties:
                client_id: {type: string}
                redirect_uri: {type: string, format: uri}
                response_type: {type: string, enum: [code]}
                scope: {type: string}
                state: {type: string}
                nonce: {type: string}
                code_challenge: {type: string}
                code_challenge_method: {type: string, enum: [S256]}
                authorization_details:
                  type: string
                  description: JSON-encoded RFC 9396 authorization details array.
              additionalProperties: true
      responses:
        "201":
          description: Short-lived pushed authorization request handle.
          content:
            application/json:
              schema:
                type: object
                required: [request_uri, expires_in]
                properties:
                  request_uri: {type: string}
                  expires_in: {type: integer}
        "400":
          description: Invalid request, DPoP proof, authorization details, redirect URI, or PKCE binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: Missing or invalid OAuth client attestation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/status-lists/{listID}:
    get:
      tags: [OID4VCI]
      summary: Retrieve an OAuth Status List Token
      operationId: vcGetStatusList
      security: []
      parameters:
        - in: path
          name: listID
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Signed Status List Token for HAIP SD-JWT VC credentials.
          content:
            application/statuslist+jwt:
              schema: {type: string}
        "404":
          description: Unknown status list.
  /oid4vci/credential-types/university-degree:
    get:
      tags: [OID4VCI]
      summary: Retrieve HAIP SD-JWT VC Type Metadata
      description: Type Metadata for ProtocolSoup's advertised HAIP university-degree vct.
      operationId: vcGetUniversityDegreeTypeMetadata
      security: []
      responses:
        "200":
          description: SD-JWT VC Type Metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [vct]
                properties:
                  vct: {type: string, format: uri}
                  name: {type: string}
                  description: {type: string}
                  claims:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "404":
          description: Type metadata is unavailable outside certification mode.
  /oid4vci/nonce:
    post:
      tags: [OID4VCI]
      summary: Acquire a fresh credential proof nonce
      description: >
        Public OID4VCI 1.0 Nonce Endpoint. No access token or other
        authorization is required. The returned c_nonce is single-use and
        expires after c_nonce_expires_in seconds.
      operationId: vcIssueCredentialNonce
      security: []
      responses:
        "200":
          description: Nonce response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /oid4vci/credential:
    post:
      tags: [OID4VCI]
      summary: Submit proof and request credential
      description: >
        Optional request field credential_response_encryption ({jwk, enc})
        requests a JWE-encrypted response (ECDH-ES; A128GCM or A256GCM); the
        response is then returned as Content-Type application/jwt instead of
        application/json. Credential configurations that declare
        key_attestations_required additionally require a key_attestation JOSE
        header on the proof JWT. Authorization accepts Bearer <token> or,
        when the token carries a DPoP cnf.jkt binding (RFC 9449), DPoP
        <token> plus a matching DPoP proof header -- presenting a
        DPoP-bound token as bare Bearer is rejected outright.
      operationId: vcIssueCredential
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: DPoP
          required: false
          schema:
            type: string
          description: RFC 9449 DPoP proof JWT. Required only when the presented access token is DPoP-bound.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
          application/jwt:
            schema:
              type: string
              description: Compact ECDH-ES JWE containing a CredentialRequest JSON object.
      responses:
        "200":
          description: Credential issued or deferred transaction created, as JSON or (when credential_response_encryption was requested) a compact JWE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
            application/jwt:
              schema:
                type: string
                description: Compact JWE-encrypted credential response.
        "400":
          description: Invalid proof, nonce, key attestation, encryption parameters, or request contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: >-
            Invalid or missing access token, missing/mismatched DPoP proof
            for a bound token, or (only when nonce enforcement is enabled
            for this endpoint) use_dpop_nonce.
          headers:
            DPoP-Nonce:
              schema:
                type: string
              description: Present when error is use_dpop_nonce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: >-
            Server error, including failure of the shared DPoP proof replay
            store when the presented token is DPoP-bound. The request fails
            closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/deferred_credential:
    post:
      tags: [OID4VCI]
      summary: Poll deferred credential transaction
      description: >
        Optional request field credential_response_encryption ({jwk, enc})
        requests a JWE-encrypted response for this poll, independent of what
        (if anything) was requested on the original Credential Request.
        Authorization accepts Bearer <token> or, when the token carries a
        DPoP cnf.jkt binding (RFC 9449), DPoP <token> plus a matching DPoP
        proof header -- presenting a DPoP-bound token as bare Bearer is
        rejected outright.
      operationId: vcDeferredCredential
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: DPoP
          required: false
          schema:
            type: string
          description: RFC 9449 DPoP proof JWT. Required only when the presented access token is DPoP-bound.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Deferred credential response, as JSON or (when credential_response_encryption was requested) a compact JWE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
            application/jwt:
              schema:
                type: string
                description: Compact JWE-encrypted credential response.
        "400":
          description: Invalid transaction request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: >-
            Invalid or missing access token, missing/mismatched DPoP proof
            for a bound token, or (only when nonce enforcement is enabled
            for this endpoint) use_dpop_nonce.
          headers:
            DPoP-Nonce:
              schema:
                type: string
              description: Present when error is use_dpop_nonce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: >-
            Server error, including failure of the shared DPoP proof replay
            store when the presented token is DPoP-bound. The request fails
            closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vci/notification:
    post:
      tags: [OID4VCI]
      summary: Report the outcome of credential storage
      operationId: vcNotifyCredentialOutcome
      description: >-
        Accepts an OID4VCI 1.0 credential status notification for a
        notification_id returned by this issuer. The identifier is bound to
        the issuing access token; DPoP-bound tokens require a matching proof.
        Repeating the same event and description is idempotent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialNotificationRequest"
      responses:
        "204":
          description: Notification accepted, including an idempotent retry.
        "400":
          description: Invalid notification request or notification identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "409":
          description: Notification conflicts with an already accepted lifecycle event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: Invalid access token or DPoP proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vp/verifier-attestation/.well-known/openid-configuration:
    get:
      tags: [OID4VP]
      summary: Verifier attestation OpenID discovery
      operationId: vcVerifierAttestationDiscovery
      description: Returns the OpenID Provider-style discovery document for the verifier attestation issuer, including the JWKS URI.
      responses:
        "200":
          description: Verifier attestation issuer metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Verifier attestation not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vp/verifier-attestation/.well-known/oauth-authorization-server:
    get:
      tags: [OID4VP]
      summary: Verifier attestation AS metadata
      operationId: vcVerifierAttestationASMetadata
      description: Returns OAuth 2.0 Authorization Server metadata for the verifier attestation issuer.
      responses:
        "200":
          description: Verifier attestation AS metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Verifier attestation not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vp/verifier-attestation/jwks:
    get:
      tags: [OID4VP]
      summary: Verifier attestation JWKS
      operationId: vcVerifierAttestationJwks
      description: Returns the JSON Web Key Set containing the verifier attestation signing key(s). Used by wallets to validate verifier_attestation request object signatures.
      responses:
        "200":
          description: Verifier attestation JWKS.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /oid4vp/request/create:
    post:
      tags: [OID4VP]
      summary: Create OID4VP authorization request object
      operationId: vcCreateOid4vpRequest
      description: |
        Creates a signed authorization request object (`typ=oauth-authz-req+jwt`).
        The verifier signs the request using the key material associated with
        the server-side `client_id_scheme` selection. The resulting OpenID4VP
        request communicates the scheme only through the `client_id` prefix;
        it does not emit the removed draft `client_id_scheme` parameter.
        For `x509_san_dns`, the `x5c` JOSE header carries the certificate chain.
        For `verifier_attestation`, the verifier attestation JWT is included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthorizationRequest"
            examples:
              directPost:
                summary: DCQL direct_post with redirect_uri scheme
                value:
                  response_mode: direct_post
                  response_uri: https://protocolsoup.com/oid4vp/response
              directPostJwt:
                summary: DCQL direct_post.jwt with x509_san_dns scheme
                value:
                  client_id_scheme: x509_san_dns
                  response_mode: direct_post.jwt
                  response_uri: https://protocolsoup.com/oid4vp/response
              haipDcApiJwt:
                summary: HAIP dc_api.jwt backend request processing (defaults to x509_hash; no browser executor included)
                value:
                  profile: haip
                  response_mode: dc_api.jwt
                  origin: https://protocolsoup.com
                  expected_origins: [https://protocolsoup.com]
      responses:
        "200":
          description: Request object creation response with request_uri and signed request JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAuthorizationResponse"
        "400":
          description: Invalid request contract (missing fields, unsupported scheme, DCQL+scope conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vp/request/{requestID}:
    get:
      tags: [OID4VP]
      summary: Get OID4VP request object
      operationId: vcGetOid4vpRequest
      parameters:
        - in: path
          name: requestID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compact signed Authorization Request JWT.
          content:
            application/oauth-authz-req+jwt:
              schema:
                type: string
        "404":
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    post:
      tags: [OID4VP]
      summary: Retrieve and wallet-nonce-bind an OID4VP request object
      operationId: vcPostOid4vpRequest
      parameters:
        - in: path
          name: requestID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [wallet_nonce]
              properties:
                wallet_nonce:
                  type: string
                wallet_metadata:
                  type: string
                  description: Optional JSON-encoded wallet metadata object.
      responses:
        "200":
          description: Compact signed Authorization Request JWT bound to wallet_nonce. Repeating the same request is safe and returns the same JWT.
          content:
            application/oauth-authz-req+jwt:
              schema: {type: string}
        "400":
          description: Missing, changed, or invalid wallet nonce/metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "405":
          description: This request URI was created for GET retrieval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vp/response:
    post:
      tags: [OID4VP]
      summary: Wallet response endpoint (direct_post / direct_post.jwt)
      operationId: vcHandleWalletResponse
      description: |
        Accepts wallet VP submissions. For `direct_post`, the wallet sends `vp_token` and `state`.
        For legacy `direct_post.jwt`, the wallet sends an encrypted `response` JWE containing a signed inner JWT.
        ECDH-ES mso_mdoc and HAIP responses carry the Authorization Response directly in the JWE payload.
        Both variants require exact correlation by `state`. DC API-shaped
        backend scaffolding is not a browser-mediated conformance surface.
        Accepts both `application/json` and `application/x-www-form-urlencoded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletResponsePayload"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WalletResponsePayload"
      responses:
        "200":
          description: Verifier policy result with decision, reason codes, and validation flags.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid wallet response payload or unknown session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oid4vp/result/{requestID}:
    get:
      tags: [OID4VP]
      summary: Get verification result
      operationId: vcGetVerificationResult
      parameters:
        - in: path
          name: requestID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification status payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Result not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        error_description:
          type: string
        error_uri:
          type: string
    CredentialRequest:
      type: object
      oneOf:
        - required: [credential_configuration_id]
        - required: [credential_identifier]
      properties:
        credential_configuration_id:
          type: string
          description: Identifier authorized for the presented access token.
        credential_identifier:
          type: string
          description: >-
            Authorization-details credential identifier authorized for the
            presented access token. It is mutually exclusive with
            credential_configuration_id.
        proofs:
          type: object
          description: OID4VCI 1.0 proof sets keyed by proof type.
          properties:
            jwt:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
              description: >-
                One JWT proof per requested credential copy. Length is capped
                by batch_credential_issuance.batch_size (20).
          additionalProperties: false
        credential_response_encryption:
          type: object
          additionalProperties: true
    CredentialResponse:
      type: object
      properties:
        credentials:
          type: array
          items:
            type: object
            required: [credential]
            properties:
              credential:
                description: Issued credential in its configured format.
        notification_id:
          type: string
          description: Identifier for reporting the credential storage outcome.
        transaction_id:
          type: string
          description: Identifier returned for deferred issuance.
        interval:
          type: integer
          minimum: 1
          description: Minimum polling interval in seconds for deferred issuance.
    CredentialNotificationRequest:
      type: object
      required: [notification_id, event]
      properties:
        notification_id:
          type: string
        event:
          type: string
          enum: [credential_accepted, credential_failure, credential_deleted]
        event_description:
          type: string
          description: Optional printable US-ASCII event detail.
    HealthResponse:
      type: object
      required: [status, version, protocols, plugins]
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
          example: 1.0.0
        protocols:
          type: array
          items:
            type: string
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginHealth"
    PluginHealth:
      type: object
      required: [plugin_id, state, healthy]
      properties:
        plugin_id:
          type: string
        state:
          type: string
          enum: [uninitialized, initializing, ready, shutting_down, stopped, error]
        healthy:
          type: boolean
        error:
          type: string
    CreateAuthorizationRequest:
      type: object
      required: [response_mode]
      properties:
        client_id:
          type: string
          description: Verifier client identifier. When omitted, derived from the chosen scheme and server configuration. HAIP and DC API requests default to the x509_hash scheme.
        client_id_scheme:
          type: string
          enum: [redirect_uri, decentralized_identifier, verifier_attestation, x509_san_dns, x509_hash]
          description: Server-side selector for the OpenID4VP Client Identifier Prefix. Determines how the request object is signed and how the wallet validates verifier identity; it is not serialized as a request-object claim. HAIP 1.0 mandates x509_hash for signed requests.
        response_mode:
          type: string
          enum: [direct_post, direct_post.jwt, dc_api, dc_api.jwt]
          description: VP token delivery mode. dc_api / dc_api.jwt select the W3C Digital Credentials API path.
        response_uri:
          type: string
          format: uri
          description: URI where the wallet submits the VP response. Required for direct_post / direct_post.jwt; not used for dc_api / dc_api.jwt.
        request_uri_method:
          type: string
          enum: [get, post]
          default: get
          description: POST enables wallet_nonce binding at the request URI endpoint; GET returns the pre-created request object directly.
        redirect_uri:
          type: string
          format: uri
          description: Must be absent when response_mode is direct_post or direct_post.jwt.
        profile:
          type: string
          enum: [haip]
          description: When set to "haip", enforces the HAIP 1.0 profile and rejects out-of-profile choices (non-DCQL, unencrypted response modes, or schemes other than x509_hash).
        origin:
          type: string
          format: uri
          description: Verifier Web Origin for the W3C Digital Credentials API path (dc_api / dc_api.jwt). Defaults to the server base URL when omitted.
        expected_origins:
          type: array
          items:
            type: string
            format: uri
          description: Expected origins included in signed DC API requests so the wallet can detect verifier request replay.
        scope:
          type: string
          description: Scope alias (mutually exclusive with dcql_query; rejected in HAIP mode).
        dcql_query:
          type: object
          additionalProperties: true
          description: >
            Digital Credentials Query Language object specifying required
            credentials and claim paths. When neither dcql_query nor scope is
            supplied, the request defaults to the canonical mDL query
            (`mso_mdoc`, doctype `org.iso.18013.5.1.mDL`). SD-JWT VC and the W3C
            formats remain selectable by naming them in an explicit query. This
            implicit default changed from SD-JWT VC to mDL `mso_mdoc`. In HAIP
            mode (`profile: haip`), each `mso_mdoc` credential that does not
            already declare `trusted_authorities` gains an `aki` Trusted
            Authorities Query (OpenID4VP 1.0 Section 6.1.1) whose value is the
            base64url SubjectKeyIdentifier of the configured IACA root. A
            Credential Query's `claim_sets` (Section 6.1) and the top-level
            `credential_sets` (Section 6.2) are both honored: each expresses
            alternative combinations (of claim `id`s, or of Credential Query
            `id`s respectively) any one of which satisfies the request, with
            `credential_sets` entries defaulting to `required: true`.
    CreateAuthorizationResponse:
      type: object
      properties:
        request_uri:
          type: string
          format: uri
          description: URI the wallet fetches to retrieve the signed request object.
        request_uri_method:
          type: string
          enum: [get, post]
        request:
          type: string
          description: Compact JWS of the signed authorization request object (typ=oauth-authz-req+jwt).
        response_mode:
          type: string
        response_uri:
          type: string
        state:
          type: string
        nonce:
          type: string
        client_id:
          type: string
        expires_in_seconds:
          type: integer
        dcql_query_supplied:
          type: boolean
        trust_mode:
          type: string
        profile:
          type: string
          description: Active profile for this request ("haip" or "general").
        origin:
          type: string
          description: Verifier Web Origin bound to a dc_api / dc_api.jwt request.
        response_audience:
          type: string
          description: Origin-prefixed (origin:&lt;origin&gt;) response audience for the DC API path.
        encrypted_response_enc_values_supported:
          type: array
          items:
            type: string
          description: Advertised JWE content-encryption algorithms (HAIP / DC API advertise A128GCM and A256GCM).
    WalletResponsePayload:
      type: object
      properties:
        state:
          type: string
          description: Opaque state value matching the authorization request (direct_post / direct_post.jwt). Not used on the DC API path.
        request_id:
          type: string
          description: Request identifier correlating a dc_api.jwt response to its session (the DC API has no state).
        vp_token:
          type: string
          description: Compact JWS VP token (for direct_post response mode).
        response:
          type: string
          description: Compact JWE containing the wallet response (for direct_post.jwt and dc_api.jwt response modes).
    ApiIndexResponse:
      type: object
      required: [service, version, protocols, endpoints]
      properties:
        service:
          type: string
        version:
          type: string
        protocols:
          type: array
          items:
            type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
