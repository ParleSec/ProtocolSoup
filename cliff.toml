# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# ProtocolSoup does not use Conventional Commits. Maintainer commits are
# prefixed with CREATE / UPDATE / PATCH / DELETE, and community contributions
# arrive as squash-merged pull request subjects, so the parsers below key off
# that convention instead.

[remote.github]
# The git remote still carries the repository's former name, which GitHub
# redirects. Pin the current name so generated links are canonical.
owner = "ParleSec"
repo = "ProtocolSoup"

[changelog]
# A Tera template to be rendered as the changelog's header.
header = """
# Changelog\n
All notable changes to ProtocolSoup are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated by [git-cliff](https://git-cliff.org) during the release workflow.
Change `cliff.toml` rather than editing entries by hand.\n
"""
# A Tera template to be rendered for each release in the changelog.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message \
                | trim_start_matches(pat="CREATE ") \
                | trim_start_matches(pat="UPDATE ") \
                | trim_start_matches(pat="PATCH ") \
                | trim_start_matches(pat="DELETE ") \
                | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render the body even when a range contains no releases to process, so the
# release workflow does not fail on an empty section.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
    # Resolve the placeholder written by the pull request preprocessor below.
    { pattern = '<REPO>', replace = "https://github.com/ParleSec/ProtocolSoup" },
]

[git]
# Commit subjects are not conventional, so parse and keep every commit.
conventional_commits = false
filter_unconventional = false
# An array of regex based parsers to modify commit messages prior to further
# processing.
commit_preprocessors = [
    # Keep the subject only; bodies carry DCO sign-offs and review notes.
    { pattern = '''(?s)\n.*''', replace = "" },
    # Link squash-merge pull request references.
    { pattern = '''\(#([0-9]+)\)''', replace = "([#${1}](<REPO>/pull/${1}))" },
]
# An array of regex based parsers for extracting data from the commit message.
# Group names are prefixed with an HTML comment so that group_by orders them by
# intent rather than alphabetically; the template strips it with `striptags`.
commit_parsers = [
    { message = '''^Merge ''', skip = true },
    # The release workflow's own changelog commit.
    { message = '''(?i)^update CHANGELOG for v''', skip = true },
    { message = '''(?i)(^| )(bump|dependenc|lockfile)''', group = "<!-- 4 -->Dependencies" },
    { message = '''(?i)^create\b''', group = "<!-- 0 -->Added" },
    { message = '''(?i)^update\b''', group = "<!-- 1 -->Changed" },
    { message = '''(?i)^patch\b''', group = "<!-- 2 -->Fixed" },
    { message = '''(?i)^delete\b''', group = "<!-- 3 -->Removed" },
    { message = '''.*''', group = "<!-- 5 -->Other Changes" },
]
# Only tags that name a release.
tag_pattern = "v[0-9].*"
# Order of commits in each group/release within the changelog.
sort_commits = "oldest"
