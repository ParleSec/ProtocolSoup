app = "protocolsoup-wallet"
primary_region = "syd"

[build]
  dockerfile = "docker/Dockerfile.wallet-harness"

[env]
  WALLET_LISTEN_ADDR = ":8080"
  WALLET_TARGET_BASE_URL = "https://protocolsoup.com"
  WALLET_DEFAULT_SUBJECT = "did:example:wallet:alice"
  WALLET_ALLOWED_CORS_ORIGINS = "https://protocolsoup.com,https://www.protocolsoup.com,https://protocolsoup.fly.dev"
  WALLET_TRUSTED_VERIFIER_ATTESTATION_ISSUERS = "https://protocolsoup.com/oid4vp/verifier-attestation"
  # Keep the mdoc holder key stable across machine replacement and cold starts.
  WALLET_DEVICE_KEY_PATH = "/data/device-key.pem"
  # WALLET_MDOC_IACA_ROOT_PEM is staged as a Fly secret by CI from the live
  # issuer IACA (/data/mdoc/iaca_root.pem), not baked into this file.
  # Optional WALLET_VERIFIER_X509_TRUST_ANCHOR_PEM may be set the same way when
  # the wallet must trust additional x509_hash / x509_san_dns request CAs.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "protocolsoup_wallet_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
