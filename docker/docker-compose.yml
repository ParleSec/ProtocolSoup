# ProtocolSoup - Split Backend Services (Base)
# Run with: docker compose up -d --build
# After pulling new code, always pass --build so frontend and gateway images
# are rebuilt from source (palette UI and /api/palette/query are baked in).
#
# This starts:
# - Gateway (API aggregation + protocol routing)
# - Federation service (OAuth2/OIDC/SAML)
# - SCIM service
# - SSF service
# - Wallet harness (OID4VCI/OID4VP holder for Looking Glass)
# - Frontend UI
#
# ==============================================
# GHCR Public Images
# ==============================================
# To use pre-built images from GitHub Container Registry instead of building locally:
# 1. Comment out the 'build:' section for each service
# 2. Uncomment the 'image:' line with the GHCR URL
#
# Available images:
#   ghcr.io/parlesec/protocolsoup-gateway:latest
#   ghcr.io/parlesec/protocolsoup-federation:latest
#   ghcr.io/parlesec/protocolsoup-scim:latest
#   ghcr.io/parlesec/protocolsoup-ssf:latest
#   ghcr.io/parlesec/protocolsoup-wallet:latest
#   ghcr.io/parlesec/protocolsoup-frontend:latest
# ==============================================

services:
  # ============================================
  # Gateway - API Aggregation + Routing
  # ============================================
  gateway:
    # For local development (build from source):
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE_CMD: ./cmd/gateway
    # For using published GHCR images, comment 'build:' above and uncomment:
    # image: ghcr.io/parlesec/protocolsoup-gateway:latest
    image: protocolsoup-gateway:latest
    container_name: protocolsoup-gateway
    ports:
      - "8080:8080"
    environment:
      - SHOWCASE_ENV=demo
      - SHOWCASE_LISTEN_ADDR=:8080
      - SHOWCASE_BASE_URL=http://localhost:8080
      - SHOWCASE_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SHOWCASE_PALETTE_DB=/app/palette.db
      - FEDERATION_SERVICE_URL=http://federation-service:8080
      - SCIM_SERVICE_URL=http://scim-service:8080
      - SSF_SERVICE_URL=http://ssf-service:8080
    depends_on:
      federation-service:
        condition: service_started
      scim-service:
        condition: service_started
      ssf-service:
        condition: service_started
    networks:
      - showcase-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Federation Service (OAuth2/OIDC/SAML)
  # ============================================
  federation-service:
    # For local development (build from source):
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE_CMD: ./cmd/server-federation
    # For using published GHCR images, comment 'build:' above and uncomment:
    # image: ghcr.io/parlesec/protocolsoup-federation:latest
    image: protocolsoup-federation:latest
    container_name: protocolsoup-federation
    environment:
      - SHOWCASE_ENV=demo
      - SHOWCASE_LISTEN_ADDR=:8080
      - SHOWCASE_BASE_URL=http://localhost:8080
      - SHOWCASE_MOCK_IDP=true
      - SHOWCASE_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - OAUTH2_REPLAY_REDIS_URL=redis://redis:6379/0
      - SSF_TO_FEDERATION_TOKEN=${SSF_TO_FEDERATION_TOKEN:-ssf-federation-caep-lab}
      - SHOWCASE_MDOC_PKI_PATH=/app/mdoc-pki
    volumes:
      - mdoc-issuer-pki:/app/mdoc-pki
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - showcase-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: protocolsoup-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - showcase-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ============================================
  # SCIM Service
  # ============================================
  scim-service:
    # For local development (build from source):
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE_CMD: ./cmd/server-scim
    # For using published GHCR images, comment 'build:' above and uncomment:
    # image: ghcr.io/parlesec/protocolsoup-scim:latest
    image: protocolsoup-scim:latest
    container_name: protocolsoup-scim
    environment:
      - SHOWCASE_ENV=demo
      - SHOWCASE_LISTEN_ADDR=:8080
      - SHOWCASE_BASE_URL=http://localhost:8080
      - SHOWCASE_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SCIM_DATA_DIR=/app/data
      # SCIM API Token for Okta/Azure AD integration
      # Set this to enable authentication on SCIM endpoints
      # Generate with: openssl rand -hex 32
      - SCIM_API_TOKEN=${SCIM_API_TOKEN:-}
    volumes:
      - scim-data:/app/data
    networks:
      - showcase-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ============================================
  # SSF Service
  # ============================================
  ssf-service:
    # For local development (build from source):
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        SERVICE_CMD: ./cmd/server-ssf
    # For using published GHCR images, comment 'build:' above and uncomment:
    # image: ghcr.io/parlesec/protocolsoup-ssf:latest
    image: protocolsoup-ssf:latest
    container_name: protocolsoup-ssf
    environment:
      - SHOWCASE_ENV=demo
      - SHOWCASE_LISTEN_ADDR=:8080
      - SHOWCASE_BASE_URL=http://localhost:8080
      - SHOWCASE_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SSF_DATA_DIR=/app/data
      - FEDERATION_SERVICE_URL=http://federation-service:8080
      - SSF_TO_FEDERATION_TOKEN=${SSF_TO_FEDERATION_TOKEN:-ssf-federation-caep-lab}
      - SSF_AS_ISSUER=http://localhost:8080
      - SSF_AS_JWKS_URI=http://federation-service:8080/api/.well-known/jwks.json
      - SSF_AS_INTROSPECT_URI=http://federation-service:8080/oauth2/introspect
      - SSF_RESOURCE=http://localhost:8080
    depends_on:
      federation-service:
        condition: service_healthy
    volumes:
      - ssf-data:/app/data
    networks:
      - showcase-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ============================================
  # mdoc IACA trust anchor (one-shot)
  # ============================================
  # ISO/IEC 18013-5 trust anchors are provisioned out of band. Copies only the
  # issuer's public IACA root out of its PKI volume, which also holds the IACA
  # and document-signer private keys and must not be mounted into the wallet.
  mdoc-trust-anchor:
    image: alpine:3.24
    container_name: protocolsoup-mdoc-trust-anchor
    command: ["install", "-m", "0644", "/issuer-pki/iaca_root.pem", "/trust/iaca_root.pem"]
    volumes:
      - mdoc-issuer-pki:/issuer-pki:ro
      - mdoc-trust:/trust
    network_mode: none
    depends_on:
      federation-service:
        condition: service_healthy
    restart: "no"

  # ============================================
  # Wallet Harness (OID4VCI / OID4VP holder)
  # ============================================
  wallet:
    # For local development (build from source):
    build:
      context: ..
      dockerfile: docker/Dockerfile.wallet-harness
    # For using published GHCR images, comment 'build:' above and uncomment:
    # image: ghcr.io/parlesec/protocolsoup-wallet:latest
    image: protocolsoup-wallet:latest
    container_name: protocolsoup-wallet
    # Shares the gateway's network namespace so http://localhost:8080 resolves
    # to the gateway. The issuer identifies itself by SHOWCASE_BASE_URL, and the
    # wallet requires metadata and proof audiences to match it exactly.
    network_mode: "service:gateway"
    entrypoint:
      - /bin/sh
      - -c
      - set -e; WALLET_MDOC_IACA_ROOT_PEM="$$(cat /run/mdoc-trust/iaca_root.pem)"; export WALLET_MDOC_IACA_ROOT_PEM; exec /app/wallet-harness
    environment:
      - WALLET_LISTEN_ADDR=:8090
      - WALLET_TARGET_BASE_URL=http://localhost:8080
    volumes:
      - mdoc-trust:/run/mdoc-trust:ro
    depends_on:
      gateway:
        condition: service_healthy
      mdoc-trust-anchor:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ============================================
  # Frontend UI
  # ============================================
  frontend:
    # For local development (build from source):
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        BACKEND_ORIGIN: http://gateway:8080
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8080
    # For using published GHCR images, comment 'build:' above and uncomment:
    # image: ghcr.io/parlesec/protocolsoup-frontend:latest
    image: protocolsoup-frontend:latest
    container_name: protocolsoup-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_ORIGIN=http://gateway:8080
      - WALLET_BACKEND_ORIGIN=${WALLET_BACKEND_ORIGIN:-http://gateway:8090} # read at runtime; set it in .env to your own wallet harness origin and skip the local one with --scale wallet=0 --scale mdoc-trust-anchor=0
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8080
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - showcase-network
    restart: unless-stopped

# ============================================
# Networks
# ============================================
networks:
  showcase-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  scim-data:
    driver: local
  ssf-data:
    driver: local
  mdoc-issuer-pki:
    driver: local
  mdoc-trust:
    driver: local