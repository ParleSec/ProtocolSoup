# Development compose file - runs only backend, frontend runs locally via npm
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: protocol-showcase-backend-dev
    ports:
      - "8080:8080"
    environment:
      - SHOWCASE_ENV=development
      - SHOWCASE_LISTEN_ADDR=:8080
      - SHOWCASE_BASE_URL=http://localhost:8080
      - SHOWCASE_MOCK_IDP=true
      - SHOWCASE_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SHOWCASE_DEBUG=true
      - OAUTH2_REPLAY_REDIS_URL=redis://redis:6379/0
    volumes:
      # Mount source for hot reload (requires air or similar)
      - ../backend:/app/src:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: protocol-showcase-redis-dev
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
