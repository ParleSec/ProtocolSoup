app = "protocolsoup-counterparty"
primary_region = "syd"

[build]
  dockerfile = "docker/Dockerfile.conformance-counterparty"

[env]
  COUNTERPARTY_LISTEN_ADDR = ":8080"
  COUNTERPARTY_BASE_URL = "https://protocolsoup-counterparty.fly.dev"

# Only the conformance capture calls this app, a few minutes per deploy, so
# it runs one Machine that stops when idle. Scenario state is held in memory
# for the length of one exchange, which a single Machine keeps consistent.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
