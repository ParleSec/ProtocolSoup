      - backend/cmd/walletharness/haip_issuance.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestNotifyCredentialAcceptedUsesNotificationBinding
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestDoDPoPJSONRequestRefreshesClientAttestationPoPOnNonceRetry

  - id: CW-H010
    specification: haip
    section: "4.3"
    level: MUST
    statement: >-
      Wallets MUST authenticate at the PAR endpoint using the same client
      authentication rules as at the Token Endpoint.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
