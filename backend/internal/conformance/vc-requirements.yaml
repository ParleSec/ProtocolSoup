        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestPKCES256ChallengeGeneration
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestPARFormIncludesCodeChallengeMethodS256
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestRFC9207IssMismatchRejection

  - id: CW-H004
    specification: haip
    section: "4"
    level: MUST
    statement: >-
      Wallets MUST support DPoP and MUST be prepared to handle DPoP-Nonce from
      the Nonce Endpoint and other Credential Issuer and Authorization Server
      endpoints.
    roles: [wallet]
    applicability: applicable
    implementation:
