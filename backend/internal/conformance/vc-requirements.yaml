        file: backend/cmd/walletharness/oid4vci_external_test.go
        name: TestIssueFromExternalIssuerRequiresTxCode

  - id: CW-010
    specification: oid4vci
    section: "13.5"
    level: MUST
    title: Credential Offer parameter values treated as not trustworthy
    question: "Should a wallet trust the parameter values in an OID4VCI Credential Offer?"
    statement: >-
      The Wallet MUST treat Credential Offer parameter values as not
      trustworthy and MUST perform the same Issuer validation as for a
      Wallet-initiated flow.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_external.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestMetadataCredentialIssuerMismatchRejection
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestOfferAuthorizationServerHintMustMatchMetadata

  - id: CW-020
    specification: oid4vci
    section: "12.2.2"
    level: MUST
    title: Issuer metadata retrieved from /.well-known/openid-credential-issuer
    question: "Where must a wallet fetch OID4VCI Credential Issuer Metadata from?"
    statement: >-
      To retrieve Credential Issuer Metadata, the Wallet MUST send an HTTP GET
      request to the Credential Issuer Identifier with path
      /.well-known/openid-credential-issuer inserted between the host and any
      path component.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_external.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_external_test.go
        name: TestWellKnownMetadataURLCandidatesWithIssuerPath
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_external_test.go
        name: TestWellKnownMetadataURLCandidatesPreserveCredentialIssuerTrailingSlash
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_external_test.go
        name: TestWellKnownMetadataURLCandidatesStripOAuthASTrailingSlash

  - id: CW-024
    specification: oid4vci
    section: "12.2.4"
    level: MUST NOT
    title: Metadata not used when credential_issuer mismatches the identifier
    question: "When must a wallet discard OID4VCI Credential Issuer Metadata?"
    statement: >-
      If the credential_issuer value in metadata does not match the Credential
      Issuer Identifier used to retrieve it (simple string comparison, no
      normalization), the metadata MUST NOT be used.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_external.go
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestMetadataCredentialIssuerMismatchRejection

  - id: CW-044
    specification: oid4vci
    section: "6.2"
    level: MUST
    title: Wallet uses returned credential_identifiers in credential requests
    question: "Which credential identifiers must a wallet use in OID4VCI Credential Requests?"
    statement: >-
      When the Token Response includes authorization_details with
      credential_identifiers, the Wallet MUST use those identifiers with the
      Access Token in subsequent Credential Requests.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestCredentialRequestBuilderIdentifierExclusivity

  - id: CW-065
    specification: oid4vci
    section: "Appendix F.1"
    level: MUST
    title: JWT proof typ, alg, aud, iat, nonce and single key reference
    question: "What must an OID4VCI JWT proof contain?"
    statement: >-
      A JWT proof has typ openid4vci-proof+jwt, alg that is neither none nor a
      MAC algorithm, aud equal to the Credential Issuer Identifier, required
      iat, nonce when the Issuer has a Nonce Endpoint, and exactly one of kid,
      jwk, or x5c as the key reference.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/main.go
      - backend/cmd/walletharness/haip_issuance.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestCreateCredentialProofJWTUsesFinalAnonymousProofShape

  - id: CW-070
    specification: oid4vci
    section: "8.2"
    level: MUST
    title: credential_identifier or credential_configuration_id, not both
    question: "Should a Credential Request use credential_identifier or credential_configuration_id?"
    statement: >-
      credential_identifier is REQUIRED when the Token Response returned
      openid_credential authorization_details with credential_identifiers and
      MUST NOT be used otherwise; when used, credential_configuration_id MUST
      NOT be present. credential_configuration_id is REQUIRED when
      credential_identifiers were not returned and MUST NOT be used otherwise.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestCredentialRequestBuilderIdentifierExclusivity

  - id: CW-072
    specification: oid4vci
    section: "8.2 and 10"
    level: MUST
    title: Credential Response encryption and decryption as JWTs
    question: "How must a wallet handle encrypted OID4VCI Credential Responses?"
    statement: >-
      When credential_response_encryption.encryption_required is true, or when
      the Wallet includes credential_response_encryption, the Wallet encrypts
      and decrypts Credential Responses as JWTs using the negotiated algorithms.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestCredentialResponseEncryptionJWERoundTrip

  - id: CW-081
    specification: oid4vci
    section: "8.3 and 9"
    level: SHOULD
    title: Deferred Credential Request waits interval seconds with a valid token
    question: "How long should a wallet wait before polling for a deferred OID4VCI credential?"
    statement: >-
      If a transaction_id is present, the Wallet SHOULD wait at least interval
      seconds before sending a Deferred Credential Request and MUST present an
      Access Token valid for the previously requested Credential(s).
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
      - backend/cmd/walletharness/main.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestCredentialResponseValueRequiresFinalCredentialsArray

  - id: CW-100
    specification: oid4vci
    section: "15.3"
    level: SHOULD
    title: Credentials stored only in encrypted form and no longer than needed
    question: "How should a wallet store the credentials it holds?"
    statement: >-
      Wallets SHOULD store Credentials only in encrypted form, and, wherever
      possible, use hardware-backed encryption. Wallets SHOULD not store
      Credentials longer than needed.
    roles: [wallet]
    applicability: deviation
    adr: docs/packages/wallet.md
    implementation:
      - backend/cmd/walletharness/main.go
      - docs/packages/wallet.md
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestGetOrCreateWalletPrunesExpiredEntries
    notes: >-
      Session-scoped in-memory credential storage is retained until the
      HashiCorp platform vault initiative. Cross-protocol security limitation
      for OID4VP presentations of the same held credentials; not an OID4VP
      normative storage deviation. Decision record is docs/packages/wallet.md
      (no separate ADR file).

  - id: CW-101
    specification: oid4vci
    section: "Appendix D.2"
    level: MUST
    title: Key attestation levels assert ISO 18045 attack resistance
    question: "When may a wallet's key attestation claim an iso_18045 key_storage level?"
    statement: >-
      This specification defines the following values for key_storage and
      user_authentication: iso_18045_high: It MUST be used when key storage or
      user authentication is resistant to attack with attack potential "High",
      equivalent to VAN.5 according to [ISO.18045]. iso_18045_moderate: It
      MUST be used when key storage or user authentication is resistant to
      attack with attack potential "Moderate", equivalent to VAN.4 according
      to [ISO.18045]. iso_18045_enhanced-basic: It MUST be used when key
      storage or user authentication is resistant to attack with attack
      potential "Enhanced-Basic", equivalent to VAN.3 according to
      [ISO.18045]. iso_18045_basic: It MUST be used when key storage or user
      authentication is resistant to attack with attack potential "Basic",
      equivalent to VAN.2 according to [ISO.18045].
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/haip_issuance.go
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestRefuseUnbackedKeyAttestationLevels
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestHAIPBatchProofsShareSingleKeyAttestation

  - id: CW-H003
    specification: haip
    section: "4"
    level: MUST
    title: FAPI 2.0 compliance including PKCE S256, PAR and iss
    question: "Which FAPI 2.0 provisions apply to HAIP wallets and issuers?"
    statement: >-
      When implementing OpenID for Verifiable Credential Issuance, both the
      Wallet and the Credential Issuer MUST comply with the provisions of the
      FAPI 2.0 Security Profile that are applicable, including PKCE with S256,
      PAR where applicable, and the iss value in the Authorization Response.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
      - backend/cmd/walletharness/oid4vci_external.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestPKCES256ChallengeGeneration
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestPARFormIncludesCodeChallengeMethodS256
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestRFC9207IssMismatchRejection

  - id: CW-H004
    specification: haip
    section: "4"
    level: MUST
    title: Wallet supports DPoP and handles DPoP-Nonce from issuer endpoints
    question: "Must a HAIP wallet handle DPoP-Nonce challenges from issuer endpoints?"
    statement: >-
      Wallets MUST support DPoP and MUST be prepared to handle DPoP-Nonce from
      the Nonce Endpoint and other Credential Issuer and Authorization Server
      endpoints.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
      - backend/cmd/walletharness/haip_issuance.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestNotifyCredentialAcceptedUsesNotificationBinding
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestDoDPoPJSONRequestRefreshesClientAttestationPoPOnNonceRetry
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestDoDPoPJSONRequestRefusesUseDPoPNonceWithoutNonceHeader

  - id: CW-H010
    specification: haip
    section: "4.3"
    level: MUST
    title: PAR endpoint authentication matches Token Endpoint rules
    question: "How must a wallet authenticate at the PAR endpoint under HAIP?"
    statement: >-
      Wallets MUST authenticate at the PAR endpoint using the same client
      authentication rules as at the Token Endpoint.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestPARFormIncludesCodeChallengeMethodS256
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestBuildAuthorizationURLFromPAR
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestShouldUseHAIPIssuancePathForExternalAttestedAS

  - id: CW-H013
    specification: haip
    section: "4.4.1"
    level: MUST
    title: Wallet Attestation x5c, no reuse across Issuers, client_id equals sub
    question: "What rules apply to HAIP Wallet Attestations?"
    statement: >-
      When using OID4VCI Appendix E Wallet Attestations, the validating
      certificate and chain excluding the trust anchor are included in the
      Client Attestation JWT x5c, attestations MUST NOT be reused across
      Issuers, the attestation sub MUST be shared across Wallet instances of
      that type, and PAR client_id MUST equal the attestation sub.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/haip_issuance.go
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestClientAttestationIssuerEnvOverride
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestHAIPAttestationJWTBuildersUseExpectedHeaders
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestPushAuthorizationRequestFetchesChallengeEndpoint
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestBuildClientAttestationPoPJWTIncludesChallengeClaim

  - id: CW-H014
    specification: haip
    section: "4.5.1"
    level: MUST
    title: Key attestations supported with x5c excluding the trust anchor
    question: "What must a HAIP wallet's key attestation carry in its x5c header?"
    statement: >-
      Wallets MUST support key attestations. When using the format specified
      in Appendix D of [OIDF.OID4VCI]: The public key used to validate the
      signature on the key attestation MUST be included in the x5c JOSE header
      of the key attestation. The X.509 certificate of the trust anchor MUST
      NOT be included in the x5c JOSE header of the key attestation. The X.509
      certificate signing the key attestation MUST NOT be self-signed.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/haip_issuance.go
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestValidateAttestationX5CExcludesTheTrustAnchor
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestHAIPBatchProofsShareSingleKeyAttestation
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestConfigurationRequiresKeyAttestationFromMetadata

  - id: CW-H017
    specification: haip
    section: "7"
    level: MUST
    title: ES256 with P-256 and SHA-256 supported for validation
    question: "Which algorithms must a HAIP wallet support for validation?"
    statement: >-
      Wallets MUST, at minimum, support ECDSA with P-256 and SHA-256 (ES256 /
      COSE -7) for validating Wallet Attestations including PoP, Key
      Attestations, jwt proofs, and signed Issuer metadata as applicable.
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/haip_issuance.go
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestGenerateEphemeralEncryptionKeyIsP256
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestHAIPAttestationJWTBuildersUseExpectedHeaders

  - id: CW-089
    specification: oid4vci
    section: "14.5"
    level: MAY
    title: Fresh Access Token via Refresh Token to refresh Credentials
    question: "How does a wallet refresh its credentials when it holds a refresh token?"
    statement: >-
      If the Credential Issuer issued a Refresh Token to the Wallet, the
      Wallet would obtain a fresh Access Token by making a request to the
      Token Endpoint, as defined in Section 6 of [RFC6749].
    roles: [wallet]
    applicability: applicable
    implementation:
      - backend/cmd/walletharness/credential_refresh.go
      - backend/cmd/walletharness/oid4vci_client.go
    tests:
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestExchangeRefreshTokenRequiresInputs
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestExchangeRefreshTokenAuthenticatesAsTheOriginalGrant
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_external_test.go
        name: TestAPIRefreshReissuesCredentialWithRefreshToken

examples:
  - id: dpop-proof
    title: DPoP proof
    question: "What does a valid DPoP proof look like?"
    summary: >-
      A DPoP proof is a JWT that a client signs with a private key it chose
      and sends in the DPoP header of an HTTP request. It shows that the
      client holds that key, for that one request (RFC 9449 Section 4).
    format: jwt
    looking_glass:
      protocol: oauth2
      flow: client_credentials
      token_mode: dpop
    fields:
      - path: header.typ
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          typ: A field with the value dpop+jwt, which explicitly types the
          DPoP proof JWT as recommended in Section 3.11 of [RFC8725].
        requirements: [DP-003]
      - path: header.alg
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          alg: An identifier for a JWS asymmetric digital signature algorithm
          from [IANA.JOSE.ALGS]. It MUST NOT be none or an identifier for a
          symmetric algorithm (Message Authentication Code (MAC)).
        requirements: [DP-004]
      - path: header.jwk
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          jwk: Represents the public key chosen by the client in JSON Web Key
          (JWK) [RFC7517] format as defined in Section 4.1.3 of [RFC7515]. It
          MUST NOT contain a private key.
        requirements: [DP-005, DP-006, DP-013]
      - path: payload.jti
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          jti: Unique identifier for the DPoP proof JWT. The value MUST be
          assigned such that there is a negligible probability that the same
          value will be assigned to any other DPoP proof used in the same
          context during the time window of validity. Such uniqueness can be
          accomplished by encoding (base64url or any other suitable encoding)
          at least 96 bits of pseudorandom data or by using a version 4
          Universally Unique Identifier (UUID) string according to [RFC4122].
          The jti can be used by the server for replay detection and
          prevention; see Section 11.1.
        requirements: [DP-002]
      - path: payload.htm
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          htm: The value of the HTTP method (Section 9.1 of [RFC9110]) of the
          request to which the JWT is attached.
        requirements: [DP-002, DP-007]
      - path: payload.htu
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          htu: The HTTP target URI (Section 7.1 of [RFC9110]) of the request
          to which the JWT is attached, without query and fragment parts.
        requirements: [DP-002, DP-008]
      - path: payload.iat
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          iat: Creation timestamp of the JWT (Section 4.1.6 of [RFC7519]).
        requirements: [DP-002, DP-010]
      - path: payload.ath
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          When the DPoP proof is used in conjunction with the presentation of
          an access token in protected resource access (see Section 7), the
          DPoP proof MUST also contain the following claim: ath: Hash of the
          access token. The value MUST be the result of a base64url encoding
          (as defined in Section 2 of [RFC7515]) the SHA-256 [SHS] hash of the
          ASCII encoding of the associated access token's value.
        requirements: [DP-011]
      - path: payload.nonce
        reference: RFC 9449 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-4.2
        statement: >-
          When the authentication server or resource server provides a
          DPoP-Nonce HTTP header in a response (see Sections 8 and 9), the
          DPoP proof MUST also contain the following claim: nonce: A recent
          nonce provided via the DPoP-Nonce HTTP header.
        requirements: [DP-009]

  - id: dpop-bound-access-token
    title: DPoP-bound access token
    question: "What does a DPoP-bound access token look like?"
    summary: >-
      A DPoP-bound access token is a JWT access token (RFC 9068) whose
      cnf.jkt claim holds the thumbprint of the client's public key. A
      resource server accepts it only together with a DPoP proof signed by
      that key (RFC 9449 Sections 6 and 7).
    format: jwt
    looking_glass:
      protocol: oauth2
      flow: client_credentials
      token_mode: dpop
    fields:
      - path: header.alg
        reference: RFC 7515 Section 4.1.1
        url: https://www.rfc-editor.org/rfc/rfc7515.html#section-4.1.1
        statement: >-
          The "alg" (algorithm) Header Parameter identifies the cryptographic
          algorithm used to secure the JWS. The JWS Signature value is not
          valid if the "alg" value does not represent a supported algorithm or
          if there is not a key for use with that algorithm associated with
          the party that digitally signed or MACed the content. "alg" values
          should either be registered in the IANA "JSON Web Signature and
          Encryption Algorithms" registry established by [JWA] or be a value
          that contains a Collision-Resistant Name. The "alg" value is a
          case-sensitive ASCII string containing a StringOrURI value. This
          Header Parameter MUST be present and MUST be understood and
          processed by implementations.
      - path: header.kid
        reference: RFC 7515 Section 4.1.4
        url: https://www.rfc-editor.org/rfc/rfc7515.html#section-4.1.4
        statement: >-
          The "kid" (key ID) Header Parameter is a hint indicating which key
          was used to secure the JWS. This parameter allows originators to
          explicitly signal a change of key to recipients. The structure of
          the "kid" value is unspecified. Its value MUST be a case-sensitive
          string. Use of this Header Parameter is OPTIONAL.
        note: >-
          The value matches the kid of one key in the JWK Set at the issuer's
          jwks_uri. That key verifies the signature.
      - path: header.typ
        reference: RFC 9068 Section 2.1
        url: https://www.rfc-editor.org/rfc/rfc9068.html#section-2.1
        statement: >-
          This specification registers the "application/at+jwt" media type,
          which can be used to indicate that the content is a JWT access
          token. JWT access tokens MUST include this media type in the "typ"
          header parameter to explicitly declare that the JWT represents an
          access token complying with this profile. Per the definition of
          "typ" in Section 4.1.9 of [RFC7515], it is RECOMMENDED that the
          "application/" prefix be omitted. Therefore, the "typ" value used
          SHOULD be "at+jwt".
        note: >-
          A resource server refuses a JWT whose typ is anything else, so an ID
          Token or a refresh token cannot be used as an access token (RFC 9068
          Section 4).
      - path: payload.iss
        reference: RFC 7519 Section 4.1.1
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-4.1.1
        statement: >-
          The "iss" (issuer) claim identifies the principal that issued the
          JWT. The processing of this claim is generally application specific.
          The "iss" value is a case-sensitive string containing a StringOrURI
          value. Use of this claim is OPTIONAL.
        note: >-
          RFC 9068 Section 2.2 lists it for a JWT access token: "iss REQUIRED
          - as defined in Section 4.1.1 of [RFC7519]." The value is the issuer
          identifier of the OAuth 2.0 authorization server at /oauth2. The RFC
          8414 metadata of this issuer names the jwks_uri whose JWK Set
          verified the token. Both requests are among the exchanges below.
      - path: payload.sub
        reference: RFC 9068 Section 2.2
        url: https://www.rfc-editor.org/rfc/rfc9068.html#section-2.2
        statement: >-
          sub REQUIRED - as defined in Section 4.1.2 of [RFC7519]. In cases of
          access tokens obtained through grants where a resource owner is
          involved, such as the authorization code grant, the value of "sub"
          SHOULD correspond to the subject identifier of the resource owner.
          In cases of access tokens obtained through grants where no resource
          owner is involved, such as the client credentials grant, the value
          of "sub" SHOULD correspond to an identifier the authorization server
          uses to indicate the client application.
        note: >-
          The client_credentials grant issued this token, so sub is the
          client's identifier.
      - path: payload.aud
        reference: RFC 7519 Section 4.1.3
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-4.1.3
        statement: >-
          The "aud" (audience) claim identifies the recipients that the JWT is
          intended for. Each principal intended to process the JWT MUST
          identify itself with a value in the audience claim. If the principal
          processing the claim does not identify itself with a value in the
          "aud" claim when this claim is present, then the JWT MUST be
          rejected. In the general case, the "aud" value is an array of
          case-sensitive strings, each containing a StringOrURI value. In the
          special case when the JWT has one audience, the "aud" value MAY be a
          single case-sensitive string containing a StringOrURI value. The
          interpretation of audience values is generally application specific.
          Use of this claim is OPTIONAL.
        note: >-
          ProtocolSoup sets aud to the identifier of the protected resource
          the token is for, which here is the URL of /oauth2/resource. RFC
          9068 Section 3: "If the request does not include a "resource"
          parameter, the authorization server MUST use a default resource
          indicator in the "aud" claim." That resource rejects a token whose
          aud does not name it.
      - path: payload.exp
        reference: RFC 7519 Section 4.1.4
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-4.1.4
        statement: >-
          The "exp" (expiration time) claim identifies the expiration time on
          or after which the JWT MUST NOT be accepted for processing. The
          processing of the "exp" claim requires that the current date/time
          MUST be before the expiration date/time listed in the "exp" claim.
          Implementers MAY provide for some small leeway, usually no more than
          a few minutes, to account for clock skew. Its value MUST be a number
          containing a NumericDate value. Use of this claim is OPTIONAL.
      - path: payload.nbf
        reference: RFC 7519 Section 4.1.5
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-4.1.5
        statement: >-
          The "nbf" (not before) claim identifies the time before which the
          JWT MUST NOT be accepted for processing. The processing of the "nbf"
          claim requires that the current date/time MUST be after or equal to
          the not-before date/time listed in the "nbf" claim. Implementers MAY
          provide for some small leeway, usually no more than a few minutes,
          to account for clock skew. Its value MUST be a number containing a
          NumericDate value. Use of this claim is OPTIONAL.
      - path: payload.iat
        reference: RFC 7519 Section 4.1.6
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-4.1.6
        statement: >-
          The "iat" (issued at) claim identifies the time at which the JWT was
          issued. This claim can be used to determine the age of the JWT. Its
          value MUST be a number containing a NumericDate value. Use of this
          claim is OPTIONAL.
      - path: payload.jti
        reference: RFC 7519 Section 4.1.7
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-4.1.7
        statement: >-
          The "jti" (JWT ID) claim provides a unique identifier for the JWT.
          The identifier value MUST be assigned in a manner that ensures that
          there is a negligible probability that the same value will be
          accidentally assigned to a different data object; if the application
          uses multiple issuers, collisions MUST be prevented among values
          produced by different issuers as well. The "jti" claim can be used
          to prevent the JWT from being replayed. The "jti" value is a
          case-sensitive string. Use of this claim is OPTIONAL.
      - path: payload.scope
        reference: RFC 8693 Section 4.2
        url: https://www.rfc-editor.org/rfc/rfc8693.html#section-4.2
        statement: >-
          The value of the "scope" claim is a JSON string containing a
          space-separated list of scopes associated with the token, in the
          format described in Section 3.3 of [RFC6749].
      - path: payload.client_id
        reference: RFC 8693 Section 4.3
        url: https://www.rfc-editor.org/rfc/rfc8693.html#section-4.3
        statement: >-
          The "client_id" claim carries the client identifier of the OAuth 2.0
          [RFC6749] client that requested the token.
        note: >-
          RFC 9068 Section 2.2 lists it for a JWT access token: "client_id
          REQUIRED - as defined in Section 4.3 of [RFC8693]."
      - path: payload.client_name
        reference: RFC 7519 Section 4.3
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-4.3
        statement: >-
          A producer and consumer of a JWT MAY agree to use Claim Names that
          are Private Names: names that are not Registered Claim Names
          (Section 4.1) or Public Claim Names (Section 4.2). Unlike Public
          Claim Names, Private Claim Names are subject to collision and should
          be used with caution.
        note: >-
          client_name is ProtocolSoup's own claim: the display name of the
          client that requested the token. No specification defines it for
          access tokens.
      - path: payload.cnf
        reference: RFC 7800 Section 3.1
        url: https://www.rfc-editor.org/rfc/rfc7800.html#section-3.1
        statement: >-
          The "cnf" claim is used in the JWT to contain members used to
          identify the proof-of-possession key.
      - path: payload.cnf.jkt
        reference: RFC 9449 Section 6.1
        url: https://www.rfc-editor.org/rfc/rfc9449.html#section-6.1
        statement: >-
          jkt: JWK SHA-256 Thumbprint confirmation method. The value of the
          jkt member MUST be the base64url encoding (as defined in [RFC7515])
          of the JWK SHA-256 Thumbprint (according to [RFC7638]) of the DPoP
          public key (in JWK format) to which the access token is bound.
        requirements: [DP-013]

  - id: oidc-id-token
    title: OpenID Connect ID Token
    question: "What does a valid OpenID Connect ID Token look like?"
    summary: >-
      An ID Token is a JWT signed by an OpenID Provider that carries Claims
      about the authentication of an End-User: who authenticated, for which
      client, and when (OpenID Connect Core 1.0 Section 2).
    format: jwt
    looking_glass:
      protocol: oidc
      flow: oidc_authorization_code
    fields:
      - path: header.alg
        reference: RFC 7515 Section 4.1.1
        url: https://www.rfc-editor.org/rfc/rfc7515.html#section-4.1.1
        statement: >-
          The "alg" (algorithm) Header Parameter identifies the cryptographic
          algorithm used to secure the JWS. The JWS Signature value is not
          valid if the "alg" value does not represent a supported algorithm or
          if there is not a key for use with that algorithm associated with
          the party that digitally signed or MACed the content. "alg" values
          should either be registered in the IANA "JSON Web Signature and
          Encryption Algorithms" registry established by [JWA] or be a value
          that contains a Collision-Resistant Name. The "alg" value is a
          case-sensitive ASCII string containing a StringOrURI value. This
          Header Parameter MUST be present and MUST be understood and
          processed by implementations.
        note: >-
          The OpenID Provider lists the algorithms it signs ID Tokens with in
          id_token_signing_alg_values_supported of its discovery document,
          which is among the exchanges below.
      - path: header.kid
        reference: RFC 7515 Section 4.1.4
        url: https://www.rfc-editor.org/rfc/rfc7515.html#section-4.1.4
        statement: >-
          The "kid" (key ID) Header Parameter is a hint indicating which key
          was used to secure the JWS. This parameter allows originators to
          explicitly signal a change of key to recipients. The structure of
          the "kid" value is unspecified. Its value MUST be a case-sensitive
          string. Use of this Header Parameter is OPTIONAL.
        note: >-
          The value matches the kid of one key in the JWK Set at the jwks_uri
          of the OpenID Provider's discovery document. That key verifies the
          signature.
      - path: header.typ
        reference: RFC 7519 Section 5.1
        url: https://www.rfc-editor.org/rfc/rfc7519.html#section-5.1
        statement: >-
          The "typ" (type) Header Parameter defined by [JWS] and [JWE] is used
          by JWT applications to declare the media type [IANA.MediaTypes] of
          this complete JWT. This is intended for use by the JWT application
          when values that are not JWTs could also be present in an
          application data structure that can contain a JWT object; the
          application can use this value to disambiguate among the different
          kinds of objects that might be present. It will typically not be
          used by applications when it is already known that the object is a
          JWT. This parameter is ignored by JWT implementations; any
          processing of this parameter is performed by the JWT application. If
          present, it is RECOMMENDED that its value be "JWT" to indicate that
          this object is a JWT. While media type names are not case sensitive,
          it is RECOMMENDED that "JWT" always be spelled using uppercase
          characters for compatibility with legacy implementations. Use of
          this Header Parameter is OPTIONAL.
      - path: payload.iss
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          iss REQUIRED. Issuer Identifier for the Issuer of the response. The
          iss value is a case-sensitive URL using the https scheme that
          contains scheme, host, and optionally, port number and path
          components and no query or fragment components.
        note: >-
          The value is the same string as issuer in the OpenID Provider's
          discovery document. OpenID Connect Core 1.0 Section 3.1.3.7 has the
          client compare them: "The Issuer Identifier for the OpenID Provider
          (which is typically obtained during Discovery) MUST exactly match
          the value of the iss (issuer) Claim."
      - path: payload.sub
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          sub REQUIRED. Subject Identifier. A locally unique and never
          reassigned identifier within the Issuer for the End-User, which is
          intended to be consumed by the Client, e.g., 24400320 or
          AItOawmwtWwcT0k51BayewNvutrJUqsvl6qs7A4. It MUST NOT exceed 255
          ASCII [RFC20] characters in length. The sub value is a
          case-sensitive string.
        note: >-
          The End-User is a demo user of the Mock IdP. Its users exist to be
          inspected and are not real identities.
      - path: payload.aud
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          aud REQUIRED. Audience(s) that this ID Token is intended for. It
          MUST contain the OAuth 2.0 client_id of the Relying Party as an
          audience value. It MAY also contain identifiers for other
          audiences. In the general case, the aud value is an array of
          case-sensitive strings. In the common special case when there is
          one audience, the aud value MAY be a single case-sensitive string.
        note: >-
          The value is the client_id of the client that sent the
          Authentication Request, as a single string because there is one
          audience.
      - path: payload.exp
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          exp REQUIRED. Expiration time on or after which the ID Token MUST
          NOT be accepted by the RP when performing authentication with the
          OP. The processing of this parameter requires that the current
          date/time MUST be before the expiration date/time listed in the
          value. Implementers MAY provide for some small leeway, usually no
          more than a few minutes, to account for clock skew. Its value is a
          JSON [RFC8259] number representing the number of seconds from
          1970-01-01T00:00:00Z as measured in UTC until the date/time.
        note: >-
          This OpenID Provider sets exp one hour after iat.
      - path: payload.iat
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          iat REQUIRED. Time at which the JWT was issued. Its value is a JSON
          number representing the number of seconds from 1970-01-01T00:00:00Z
          as measured in UTC until the date/time.
      - path: payload.auth_time
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          auth_time Time when the End-User authentication occurred. Its value
          is a JSON number representing the number of seconds from
          1970-01-01T00:00:00Z as measured in UTC until the date/time. When a
          max_age request is made or when auth_time is requested as an
          Essential Claim, then this Claim is REQUIRED; otherwise, its
          inclusion is OPTIONAL.
        note: >-
          The Authentication Request below sends no max_age and does not
          request auth_time as an Essential Claim, so here the claim is
          OPTIONAL and this OpenID Provider includes it.
      - path: payload.nonce
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          nonce String value used to associate a Client session with an ID
          Token, and to mitigate replay attacks. The value is passed through
          unmodified from the Authentication Request to the ID Token. If
          present in the ID Token, Clients MUST verify that the nonce Claim
          Value is equal to the value of the nonce parameter sent in the
          Authentication Request. If present in the Authentication Request,
          Authorization Servers MUST include a nonce Claim in the ID Token
          with the Claim Value being the nonce value sent in the
          Authentication Request. Authorization Servers SHOULD perform no
          other processing on nonce values used. The nonce value is a
          case-sensitive string.
        note: >-
          The value equals the nonce parameter of the Authentication Request,
          which is among the exchanges below.
      - path: payload.acr
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          acr OPTIONAL. Authentication Context Class Reference. String
          specifying an Authentication Context Class Reference value that
          identifies the Authentication Context Class that the authentication
          performed satisfied.
        note: >-
          The value is this OpenID Provider's own identifier for a sign-in
          with a password, listed in acr_values_supported of its discovery
          document. Section 2 also says: "Parties using this claim will need
          to agree upon the meanings of the values used, which may be context
          specific."
      - path: payload.amr
        reference: OpenID Connect Core 1.0 Section 2
        url: https://openid.net/specs/openid-connect-core-1_0.html#IDToken
        statement: >-
          amr OPTIONAL. Authentication Methods References. JSON array of
          strings that are identifiers for authentication methods used in the
          authentication. For instance, values might indicate that both
          password and OTP authentication methods were used. The amr value is
          an array of case-sensitive strings.
        note: >-
          RFC 8176 Section 2 registers pwd as "Password-based
          authentication".

  - id: openid-configuration
    title: OpenID Provider configuration
    question: "What does an OpenID Connect discovery document look like?"
    summary: >-
      An OpenID Provider configuration is the JSON document an OpenID Provider
      publishes at /.well-known/openid-configuration. It names the provider's
      endpoints and what it supports, which is the information a Relying
      Party needs to interact with it (OpenID Connect Discovery 1.0 Sections 3
      and 4).
    format: json
    looking_glass:
      protocol: oidc
      flow: oidc_discovery
    fields:
      - path: document.issuer
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          issuer REQUIRED. URL using the https scheme with no query or
          fragment components that the OP asserts as its Issuer Identifier. If
          Issuer discovery is supported (see Section 2), this value MUST be
          identical to the issuer value returned by WebFinger. This also MUST
          be identical to the iss Claim value in ID Tokens issued from this
          Issuer.
      - path: document.authorization_endpoint
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          authorization_endpoint REQUIRED. URL of the OP's OAuth 2.0
          Authorization Endpoint [OpenID.Core]. This URL MUST use the https
          scheme and MAY contain port, path, and query parameter components.
      - path: document.token_endpoint
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          token_endpoint URL of the OP's OAuth 2.0 Token Endpoint
          [OpenID.Core]. This is REQUIRED unless only the Implicit Flow is
          used. This URL MUST use the https scheme and MAY contain port, path,
          and query parameter components.
      - path: document.userinfo_endpoint
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          userinfo_endpoint RECOMMENDED. URL of the OP's UserInfo Endpoint
          [OpenID.Core]. This URL MUST use the https scheme and MAY contain
          port, path, and query parameter components.
      - path: document.jwks_uri
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          jwks_uri REQUIRED. URL of the OP's JWK Set [JWK] document, which
          MUST use the https scheme. This contains the signing key(s) the RP
          uses to validate signatures from the OP. The JWK Set MAY also
          contain the Server's encryption key(s), which are used by RPs to
          encrypt requests to the Server. When both signing and encryption
          keys are made available, a use (public key use) parameter value is
          REQUIRED for all keys in the referenced JWK Set to indicate each
          key's intended usage. Although some algorithms allow the same key to
          be used for both signatures and encryption, doing so is NOT
          RECOMMENDED, as it is less secure. The JWK x5c parameter MAY be used
          to provide X.509 representations of keys provided. When used, the
          bare key values MUST still be present and MUST match those in the
          certificate. The JWK Set MUST NOT contain private or symmetric key
          values.
      - path: document.registration_endpoint
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          registration_endpoint RECOMMENDED. URL of the OP's Dynamic Client
          Registration Endpoint [OpenID.Registration], which MUST use the
          https scheme.
        note: >-
          Present because Dynamic Client Registration is enabled on this
          deployment.
      - path: document.revocation_endpoint
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          revocation_endpoint OPTIONAL. URL of the authorization server's
          OAuth 2.0 revocation endpoint [RFC7009].
      - path: document.introspection_endpoint
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          introspection_endpoint OPTIONAL. URL of the authorization server's
          OAuth 2.0 introspection endpoint [RFC7662].
      - path: document.scopes_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          scopes_supported RECOMMENDED. JSON array containing a list of the
          OAuth 2.0 [RFC6749] scope values that this server supports. The
          server MUST support the openid scope value. Servers MAY choose not
          to advertise some supported scope values even when this parameter is
          used, although those defined in [OpenID.Core] SHOULD be listed, if
          supported.
        note: >-
          An Authentication Request is granted only values from this list. Any
          other scope value is ignored.
      - path: document.response_types_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          response_types_supported REQUIRED. JSON array containing a list of
          the OAuth 2.0 response_type values that this OP supports. Dynamic
          OpenID Providers MUST support the code, id_token, and the id_token
          token Response Type values.
      - path: document.response_modes_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          response_modes_supported OPTIONAL. JSON array containing a list of
          the OAuth 2.0 response_mode values that this OP supports, as
          specified in OAuth 2.0 Multiple Response Type Encoding Practices
          [OAuth.Responses]. If omitted, the default for Dynamic OpenID
          Providers is ["query", "fragment"].
      - path: document.grant_types_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          grant_types_supported OPTIONAL. JSON array containing a list of the
          OAuth 2.0 Grant Type values that this OP supports. Dynamic OpenID
          Providers MUST support the authorization_code and implicit Grant
          Type values and MAY support other Grant Types. If omitted, the
          default value is ["authorization_code", "implicit"].
        note: >-
          The client_credentials and device authorization grants are served by
          the OAuth 2.0 issuer at /oauth2, which publishes its own metadata.
      - path: document.subject_types_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          subject_types_supported REQUIRED. JSON array containing a list of
          the Subject Identifier types that this OP supports. Valid types
          include pairwise and public.
      - path: document.id_token_signing_alg_values_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          id_token_signing_alg_values_supported REQUIRED. JSON array
          containing a list of the JWS signing algorithms (alg values)
          supported by the OP for the ID Token to encode the Claims in a JWT
          [JWT]. The algorithm RS256 MUST be included. The value none MAY be
          supported but MUST NOT be used unless the Response Type used returns
          no ID Token from the Authorization Endpoint (such as when using the
          Authorization Code Flow).
      - path: document.userinfo_signing_alg_values_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          userinfo_signing_alg_values_supported OPTIONAL. JSON array
          containing a list of the JWS [JWS] signing algorithms (alg values)
          [JWA] supported by the UserInfo Endpoint to encode the Claims in a
          JWT [JWT]. The value none MAY be included.
      - path: document.request_object_signing_alg_values_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          request_object_signing_alg_values_supported OPTIONAL. JSON array
          containing a list of the JWS signing algorithms (alg values)
          supported by the OP for Request Objects, which are described in
          Section 6.1 of OpenID Connect Core 1.0 [OpenID.Core]. These
          algorithms are used both when the Request Object is passed by value
          (using the request parameter) and when it is passed by reference
          (using the request_uri parameter). Servers SHOULD support none and
          RS256.
        note: >-
          An unsigned Request Object is accepted only from a client registered
          with request_object_signing_alg none.
      - path: document.token_endpoint_auth_methods_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          token_endpoint_auth_methods_supported OPTIONAL. JSON array
          containing a list of Client Authentication methods supported by this
          Token Endpoint. The options are client_secret_post,
          client_secret_basic, client_secret_jwt, and private_key_jwt, as
          described in Section 9 of OpenID Connect Core 1.0 [OpenID.Core].
          Other authentication methods MAY be defined by extensions. If
          omitted, the default is client_secret_basic -- the HTTP Basic
          Authentication Scheme specified in Section 2.3.1 of OAuth 2.0
          [RFC6749].
      - path: document.claims_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          claims_supported RECOMMENDED. JSON array containing a list of the
          Claim Names of the Claims that the OpenID Provider MAY be able to
          supply values for. Note that for privacy or other reasons, this
          might not be an exhaustive list.
      - path: document.acr_values_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          acr_values_supported OPTIONAL. JSON array containing a list of the
          Authentication Context Class References that this OP supports.
      - path: document.code_challenge_methods_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          code_challenge_methods_supported OPTIONAL. JSON array containing a
          list of Proof Key for Code Exchange (PKCE) [RFC7636] code challenge
          methods supported by this authorization server. Code challenge
          method values are used in the "code_challenge_method" parameter
          defined in Section 4.3 of [RFC7636]. The valid code challenge method
          values are those registered in the IANA "PKCE Code Challenge
          Methods" registry [IANA.OAuth.Parameters]. If omitted, the
          authorization server does not support PKCE.
        note: >-
          The authorization endpoint refuses a code_challenge sent with any
          other method, or with none, with invalid_request.
      - path: document.token_endpoint_auth_signing_alg_values_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          token_endpoint_auth_signing_alg_values_supported OPTIONAL. JSON
          array containing a list of the JWS signing algorithms (alg values)
          supported by the Token Endpoint for the signature on the JWT [JWT]
          used to authenticate the Client at the Token Endpoint for the
          private_key_jwt and client_secret_jwt authentication methods.
          Servers SHOULD support RS256. The value none MUST NOT be used.
      - path: document.revocation_endpoint_auth_methods_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          revocation_endpoint_auth_methods_supported OPTIONAL. JSON array
          containing a list of client authentication methods supported by this
          revocation endpoint. The valid client authentication method values
          are those registered in the IANA "OAuth Token Endpoint
          Authentication Methods" registry [IANA.OAuth.Parameters]. If
          omitted, the default is "client_secret_basic" -- the HTTP Basic
          Authentication Scheme specified in Section 2.3.1 of OAuth 2.0
          [RFC6749].
      - path: document.revocation_endpoint_auth_signing_alg_values_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          revocation_endpoint_auth_signing_alg_values_supported OPTIONAL. JSON
          array containing a list of the JWS signing algorithms ("alg" values)
          supported by the revocation endpoint for the signature on the JWT
          [JWT] used to authenticate the client at the revocation endpoint for
          the "private_key_jwt" and "client_secret_jwt" authentication
          methods. This metadata entry MUST be present if either of these
          authentication methods are specified in the
          "revocation_endpoint_auth_methods_supported" entry. No default
          algorithms are implied if this entry is omitted. The value "none"
          MUST NOT be used.
      - path: document.introspection_endpoint_auth_methods_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          introspection_endpoint_auth_methods_supported OPTIONAL. JSON array
          containing a list of client authentication methods supported by this
          introspection endpoint. The valid client authentication method
          values are those registered in the IANA "OAuth Token Endpoint
          Authentication Methods" registry [IANA.OAuth.Parameters] or those
          registered in the IANA "OAuth Access Token Types" registry
          [IANA.OAuth.Parameters]. (These values are and will remain distinct,
          due to Section 7.2.) If omitted, the set of supported authentication
          methods MUST be determined by other means.
      - path: document.request_parameter_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          request_parameter_supported OPTIONAL. Boolean value specifying
          whether the OP supports use of the request parameter, with true
          indicating support. If omitted, the default value is false.
        note: >-
          A request parameter is refused with request_not_supported.
      - path: document.request_uri_parameter_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          request_uri_parameter_supported OPTIONAL. Boolean value specifying
          whether the OP supports use of the request_uri parameter, with true
          indicating support. If omitted, the default value is true.
        note: >-
          True because Dynamic Client Registration is enabled on this
          deployment.
      - path: document.claims_parameter_supported
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          claims_parameter_supported OPTIONAL. Boolean value specifying
          whether the OP supports use of the claims parameter, with true
          indicating support. If omitted, the default value is false.
      - path: document.authorization_response_iss_parameter_supported
        reference: RFC 9207 Section 3
        url: https://www.rfc-editor.org/rfc/rfc9207.html#section-3
        statement: >-
          authorization_response_iss_parameter_supported: Boolean parameter
          indicating whether the authorization server provides the iss
          parameter in the authorization response as defined in Section 2. If
          omitted, the default value is false.

  - id: oauth-authorization-server
    title: OAuth 2.0 authorization server metadata document
    question: "What does OAuth 2.0 authorization server metadata look like?"
    summary: >-
      Authorization server metadata is the JSON document an OAuth 2.0
      authorization server publishes at
      /.well-known/oauth-authorization-server. It names the server's
      endpoints and capabilities, so a client can learn how to interact with
      it (RFC 8414 Sections 2 and 3).
    format: json
    fields:
      - path: document.agent_auth
        reference: auth.md profile, Discovery
        url: https://github.com/workos/auth.md/blob/b53c9edfbfeea679b617727ebca9ba436bade794/README.md#discovery
        statement: >-
          The agent_auth block is the profile extension carrying the
          registration and claim surface.
        note: >-
          RFC 8414 Section 2 permits members it does not define: "Additional
          authorization server metadata parameters MAY also be used."
      - path: document.authorization_endpoint
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          authorization_endpoint URL of the authorization server's
          authorization endpoint [RFC6749]. This is REQUIRED unless no grant
          types are supported that use the authorization endpoint.
      - path: document.authorization_response_iss_parameter_supported
        reference: RFC 9207 Section 3
        url: https://www.rfc-editor.org/rfc/rfc9207.html#section-3
        statement: >-
          authorization_response_iss_parameter_supported: Boolean parameter
          indicating whether the authorization server provides the iss
          parameter in the authorization response as defined in Section 2. If
          omitted, the default value is false.
      - path: document.code_challenge_methods_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          code_challenge_methods_supported OPTIONAL. JSON array containing a
          list of Proof Key for Code Exchange (PKCE) [RFC7636] code challenge
          methods supported by this authorization server. Code challenge
          method values are used in the "code_challenge_method" parameter
          defined in Section 4.3 of [RFC7636]. The valid code challenge method
          values are those registered in the IANA "PKCE Code Challenge
          Methods" registry [IANA.OAuth.Parameters]. If omitted, the
          authorization server does not support PKCE.
        note: >-
          The authorization endpoint refuses a code_challenge sent with any
          other method, or with none, with invalid_request.
      - path: document.grant_types_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          grant_types_supported OPTIONAL. JSON array containing a list of the
          OAuth 2.0 grant type values that this authorization server supports.
          The array values used are the same as those used with the
          "grant_types" parameter defined by "OAuth 2.0 Dynamic Client
          Registration Protocol" [RFC7591]. If omitted, the default value is
          "["authorization_code", "implicit"]".
        note: >-
          The client_credentials and device authorization grants are served by
          the OAuth 2.0 issuer at /oauth2, which publishes its own metadata.
      - path: document.introspection_endpoint
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          introspection_endpoint OPTIONAL. URL of the authorization server's
          OAuth 2.0 introspection endpoint [RFC7662].
      - path: document.introspection_endpoint_auth_methods_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          introspection_endpoint_auth_methods_supported OPTIONAL. JSON array
          containing a list of client authentication methods supported by this
          introspection endpoint. The valid client authentication method
          values are those registered in the IANA "OAuth Token Endpoint
          Authentication Methods" registry [IANA.OAuth.Parameters] or those
          registered in the IANA "OAuth Access Token Types" registry
          [IANA.OAuth.Parameters]. (These values are and will remain distinct,
          due to Section 7.2.) If omitted, the set of supported authentication
          methods MUST be determined by other means.
      - path: document.issuer
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          issuer REQUIRED. The authorization server's issuer identifier, which
          is a URL that uses the "https" scheme and has no query or fragment
          components. Authorization server metadata is published at a location
          that is ".well-known" according to RFC 5785 [RFC5785] derived from
          this issuer identifier, as described in Section 3. The issuer
          identifier is used to prevent authorization server mix-up attacks,
          as described in "OAuth 2.0 Mix-Up Mitigation" [MIX-UP].
      - path: document.jwks_uri
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          jwks_uri OPTIONAL. URL of the authorization server's JWK Set [JWK]
          document. The referenced document contains the signing key(s) the
          client uses to validate signatures from the authorization server.
          This URL MUST use the "https" scheme. The JWK Set MAY also contain
          the server's encryption key or keys, which are used by clients to
          encrypt requests to the server. When both signing and encryption
          keys are made available, a "use" (public key use) parameter value is
          REQUIRED for all keys in the referenced JWK Set to indicate each
          key's intended usage.
      - path: document.registration_endpoint
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          registration_endpoint OPTIONAL. URL of the authorization server's
          OAuth 2.0 Dynamic Client Registration endpoint [RFC7591].
        note: >-
          Present because Dynamic Client Registration is enabled on this
          deployment.
      - path: document.response_modes_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          response_modes_supported OPTIONAL. JSON array containing a list of
          the OAuth 2.0 "response_mode" values that this authorization server
          supports, as specified in "OAuth 2.0 Multiple Response Type Encoding
          Practices" [OAuth.Responses]. If omitted, the default is "["query",
          "fragment"]". The response mode value "form_post" is also defined in
          "OAuth 2.0 Form Post Response Mode" [OAuth.Post].
      - path: document.response_types_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          response_types_supported REQUIRED. JSON array containing a list of
          the OAuth 2.0 "response_type" values that this authorization server
          supports. The array values used are the same as those used with the
          "response_types" parameter defined by "OAuth 2.0 Dynamic Client
          Registration Protocol" [RFC7591].
      - path: document.revocation_endpoint
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          revocation_endpoint OPTIONAL. URL of the authorization server's
          OAuth 2.0 revocation endpoint [RFC7009].
      - path: document.revocation_endpoint_auth_methods_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          revocation_endpoint_auth_methods_supported OPTIONAL. JSON array
          containing a list of client authentication methods supported by this
          revocation endpoint. The valid client authentication method values
          are those registered in the IANA "OAuth Token Endpoint
          Authentication Methods" registry [IANA.OAuth.Parameters]. If
          omitted, the default is "client_secret_basic" -- the HTTP Basic
          Authentication Scheme specified in Section 2.3.1 of OAuth 2.0
          [RFC6749].
      - path: document.revocation_endpoint_auth_signing_alg_values_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          revocation_endpoint_auth_signing_alg_values_supported OPTIONAL. JSON
          array containing a list of the JWS signing algorithms ("alg" values)
          supported by the revocation endpoint for the signature on the JWT
          [JWT] used to authenticate the client at the revocation endpoint for
          the "private_key_jwt" and "client_secret_jwt" authentication
          methods. This metadata entry MUST be present if either of these
          authentication methods are specified in the
          "revocation_endpoint_auth_methods_supported" entry. No default
          algorithms are implied if this entry is omitted. The value "none"
          MUST NOT be used.
      - path: document.scopes_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          scopes_supported RECOMMENDED. JSON array containing a list of the
          OAuth 2.0 [RFC6749] "scope" values that this authorization server
          supports. Servers MAY choose not to advertise some supported scope
          values even when this parameter is used.
      - path: document.service_documentation
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          service_documentation OPTIONAL. URL of a page containing
          human-readable information that developers might want or need to
          know when using the authorization server. In particular, if the
          authorization server does not support Dynamic Client Registration,
          then information on how to register clients needs to be provided in
          this documentation.
      - path: document.token_endpoint
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          token_endpoint URL of the authorization server's token endpoint
          [RFC6749]. This is REQUIRED unless only the implicit grant type is
          supported.
      - path: document.token_endpoint_auth_methods_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          token_endpoint_auth_methods_supported OPTIONAL. JSON array
          containing a list of client authentication methods supported by this
          token endpoint. Client authentication method values are used in the
          "token_endpoint_auth_method" parameter defined in Section 2 of
          [RFC7591]. If omitted, the default is "client_secret_basic" -- the
          HTTP Basic Authentication Scheme specified in Section 2.3.1 of OAuth
          2.0 [RFC6749].
      - path: document.token_endpoint_auth_signing_alg_values_supported
        reference: RFC 8414 Section 2
        url: https://www.rfc-editor.org/rfc/rfc8414.html#section-2
        statement: >-
          token_endpoint_auth_signing_alg_values_supported OPTIONAL. JSON
          array containing a list of the JWS signing algorithms ("alg" values)
          supported by the token endpoint for the signature on the JWT [JWT]
          used to authenticate the client at the token endpoint for the
          "private_key_jwt" and "client_secret_jwt" authentication methods.
          This metadata entry MUST be present if either of these
          authentication methods are specified in the
          "token_endpoint_auth_methods_supported" entry. No default algorithms
          are implied if this entry is omitted. Servers SHOULD support
          "RS256". The value "none" MUST NOT be used.
      - path: document.userinfo_endpoint
        reference: OpenID Connect Discovery 1.0 Section 3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
        statement: >-
          userinfo_endpoint RECOMMENDED. URL of the OP's UserInfo Endpoint
          [OpenID.Core]. This URL MUST use the https scheme and MAY contain
          port, path, and query parameter components.
        note: >-
          This issuer is also an OpenID Provider, so its OAuth 2.0 metadata
          names the UserInfo Endpoint as well.
