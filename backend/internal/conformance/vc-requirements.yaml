        name: TestMsoMdocPreAuthorizedIssuance

  - id: SDJWT-001
    specification: rfc9901
    section: "4.1"
    level: "MUST NOT"
    title: Same digest value not appearing more than once in the SD-JWT
    question: "Can the same digest value appear twice in an SD-JWT?"
    statement: The same digest value MUST NOT appear more than once in the SD-JWT.
    roles: [issuer, holder, verifier]
