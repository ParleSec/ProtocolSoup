      - package: ./internal/protocols/oid4vp
        file: backend/internal/protocols/oid4vp/plugin_test.go
        name: TestDirectPostPolicyRejectsUncommittedSDJWTDisclosure

  - id: SDJWT-005
    specification: rfc9901
    section: "4.1.1 and 7.1"
    level: MUST
    title: Recursive disclosure processing at committed positions
    question: "How are nested SD-JWT Disclosures processed?"
    statement: >-
      Disclosures are processed recursively at their committed object or array
      positions, while nested _sd_alg and permanent-claim collisions are
