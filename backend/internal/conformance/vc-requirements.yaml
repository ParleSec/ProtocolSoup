    tests:
      - package: ./internal/vc
        file: backend/internal/vc/sdjwt_test.go
        name: TestProcessSDJWTDisclosuresResolvesArrayElementsPositionally
      - package: ./internal/vc
        file: backend/internal/vc/sdjwt_test.go
        name: TestProcessSDJWTDisclosuresResolvesRecursiveObjectAtDigestPosition
      - package: ./internal/vc
        file: backend/internal/vc/sdjwt_test.go
        name: TestProcessSDJWTDisclosuresRejectsNestedSDAlg
      - package: ./internal/vc
        file: backend/internal/vc/sdjwt_test.go
        name: TestProcessSDJWTDisclosuresRejectsPermanentClaimCollision

