        name: TestClientAttestationIssuerEnvOverride
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/main_test.go
        name: TestHAIPAttestationJWTBuildersUseExpectedHeaders
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestPushAuthorizationRequestFetchesChallengeEndpoint
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestBuildClientAttestationPoPJWTIncludesChallengeClaim

  - id: CW-H014
    specification: haip
    section: "4.5.1"
    level: MUST
    statement: >-
      Wallets MUST support key attestations. Software wallets MUST NOT claim
      hardware or ISO 18045 assurance properties they cannot prove.
    roles: [wallet]
    applicability: applicable
