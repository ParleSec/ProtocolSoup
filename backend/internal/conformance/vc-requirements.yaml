    specification: oid4vci
    section: "4.1"
    level: MUST NOT
    title: credential_offer not present when credential_offer_uri is present
    question: "Can a Credential Offer carry both credential_offer and credential_offer_uri?"
    statement: >-
      credential_offer MUST NOT be present when credential_offer_uri is present
      (and vice versa).
    roles: [wallet]
