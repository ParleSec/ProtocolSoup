      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestBuildAuthorizationURLFromPAR
      - package: ./cmd/walletharness
        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestShouldUseHAIPIssuancePathForExternalAttestedAS

  - id: CW-H013
    specification: haip
    section: "4.4.1"
    level: MUST
    statement: >-
      When using OID4VCI Appendix E Wallet Attestations, the validating
      certificate and chain excluding the trust anchor are included in the
      Client Attestation JWT x5c, attestations MUST NOT be reused across
