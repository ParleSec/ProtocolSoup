  - id: SDJWT-000
    specification: rfc9901
    section: "4"
    level: "MUST NOT"
    title: Trailing tilde not omitted when there is no Key Binding JWT
    question: "Must an SD-JWT end with a tilde when there is no Key Binding JWT?"
    statement: >-
      In the case that there is no Key Binding JWT, the last element MUST be an
      empty string and the last separating tilde character MUST NOT be omitted.
    roles: [issuer, holder, verifier]
    applicability: applicable
    implementation:
