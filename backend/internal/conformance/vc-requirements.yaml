        file: backend/internal/protocols/oid4vci/haip_conformance_test.go
        name: TestCredentialRequestEncryptionRoundTrip
      - package: ./internal/protocols/oid4vci
        file: backend/internal/protocols/oid4vci/haip_conformance_test.go
        name: TestCredentialRequestEncryptionKeyIsDedicated

  - id: CI-022
    specification: oid4vci
    section: "8.2"
    level: MUST
    title: Credential Request encrypted when it asks for an encrypted response
    question: "When must an OID4VCI Credential Request be encrypted?"
    statement: >-
      Credential Request encryption MUST be used if the
      credential_response_encryption parameter is included, to prevent it being
      substituted by an attacker.
    roles: [issuer]
    applicability: applicable
    implementation:
      - backend/internal/protocols/oid4vci/credential_request_encryption.go
      - backend/internal/protocols/oid4vci/handlers.go
    tests:
      - package: ./internal/protocols/oid4vci
        file: backend/internal/protocols/oid4vci/haip_conformance_test.go
        name: TestPlaintextRequestCannotAskForEncryptedResponse

  - id: CI-023
    specification: oid4vci
    section: "9.2"
    level: MUST
    title: Deferred Credential Response encrypted when encryption was requested
    question: "Must an OID4VCI Deferred Credential Response be encrypted while issuance is pending?"
    statement: >-
      If the Client requested an encrypted response by including the
      credential_response_encryption object in the request, the Credential
      Issuer MUST encode the information in the Deferred Credential Response as
      specified by Section 10, using the parameters from the
      credential_response_encryption object.
    roles: [issuer]
    applicability: applicable
    implementation:
      - backend/internal/protocols/oid4vci/handlers.go
    tests:
      - package: ./internal/protocols/oid4vci
        file: backend/internal/protocols/oid4vci/haip_conformance_test.go
        name: TestDeferredPendingResponseIsEncryptedWhenRequested

  - id: DP-001
