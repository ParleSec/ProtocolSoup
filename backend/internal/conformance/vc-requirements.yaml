  - id: SDJWT-002
    specification: rfc9901
    section: "4.1.1"
    level: MUST
    title: Default _sd_alg of sha-256 when not present at the top level
    question: "Which hash algorithm applies when an SD-JWT has no _sd_alg claim?"
    statement: >-
      If the _sd_alg claim is not present at the top level, a default value of
      sha-256 MUST be used.
    roles: [issuer, holder, verifier]
    applicability: applicable
    implementation:
      - backend/internal/vc/sdjwt.go
    tests:
