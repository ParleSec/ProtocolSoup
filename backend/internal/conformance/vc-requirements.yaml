      - package: ./internal/vc
        file: backend/internal/vc/sdjwt_test.go
        name: TestProcessSDJWTDisclosuresRejectsPermanentClaimCollision

  # --- OID4VCI / HAIP wallet-role matrix (CW-*) ---

  - id: CW-001
    specification: oid4vci
    section: "4.1"
    level: MUST NOT
    statement: >-
      credential_offer MUST NOT be present when credential_offer_uri is present
      (and vice versa).
    roles: [wallet]
    applicability: applicable
    implementation:
