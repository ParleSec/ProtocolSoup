        file: backend/cmd/walletharness/oid4vci_client_test.go
        name: TestConfigurationRequiresKeyAttestationFromMetadata

  - id: CW-H017
    specification: haip
    section: "7"
    level: MUST
    statement: >-
      Wallets MUST, at minimum, support ECDSA with P-256 and SHA-256 (ES256 /
      COSE -7) for validating Wallet Attestations including PoP, Key
      Attestations, jwt proofs, and signed Issuer metadata as applicable.
    roles: [wallet]
