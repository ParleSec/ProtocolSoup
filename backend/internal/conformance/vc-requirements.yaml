      - package: ./internal/vc
        file: backend/internal/vc/sdjwt_test.go
        name: TestSDJWTDisclosureDigestsRejectsUnsupportedAlgorithm

  - id: SDJWT-003
    specification: rfc9901
    section: "7.1"
    level: MUST
    title: Claim names _sd and ... cause SD-JWT rejection
    question: "What happens when an SD-JWT Disclosure uses the claim name _sd or ...?"
    statement: >-
      If the claim name is _sd or ..., the SD-JWT MUST be rejected.
    roles: [issuer, holder, verifier]
    applicability: applicable
    implementation:
      - backend/internal/vc/sdjwt.go
    tests:
      - package: ./internal/vc
        file: backend/internal/vc/sdjwt_test.go
        name: TestDecodeSDJWTDisclosureRejectsReservedClaimNames

  - id: SDJWT-004
    specification: rfc9901
    section: "7.1"
    level: MUST
    title: SD-JWT rejected when a disclosure is not referenced by digest
    question: "What happens when an SD-JWT carries a Disclosure that no digest references?"
    statement: >-
      If any Disclosure was not referenced by digest value in the
      Issuer-signed JWT (directly or recursively via other Disclosures), the
      SD-JWT MUST be rejected.
    roles: [verifier]
    applicability: applicable
    implementation:
