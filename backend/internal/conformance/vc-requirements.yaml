  - id: MDOC-005
    specification: iso18013-5
    section: "B.1"
    level: MUST
    title: Document-signer certificates chain to an IACA root per Annex B
    question: "How must an mdoc document-signer certificate be validated?"
    statement: >-
      Document-signer certificates satisfy the Annex B profile, chain to an
      independently configured IACA root, and their signing key is bound by
      the COSE signature. When IssuerAuth is signed by the configured trust
      anchor itself (verified chain length 1), as in a self-signed trust-anchor
      mock-wallet shape, the DS-only Annex B profile checks are skipped after
      successful path validation and P-256 key checks.
    roles: [issuer, wallet, verifier]
    applicability: applicable
    implementation:
      - backend/internal/mdoc/verify.go
    tests:
      - package: ./internal/mdoc
        file: backend/internal/mdoc/verify_test.go
        name: TestVerifyIssuerSignedRejectsNilRoots
      - package: ./internal/mdoc
        file: backend/internal/mdoc/verify_test.go
        name: TestDocumentSignerCertificateProfileRejectsInvalidFields
      - package: ./internal/mdoc
        file: backend/internal/mdoc/verify_test.go
        name: TestIssuerAuthSignatureBindsRFC9360X5ChainLeaf
      - package: ./internal/mdoc
        file: backend/internal/mdoc/verify_test.go
        name: TestVerifyIssuerSignedAcceptsTrustAnchorAsDocumentSigner
      - package: ./internal/mdoc
        file: backend/internal/mdoc/verify_test.go
        name: TestVerifyIssuerSignedRejectsCADocumentSignerBeneathIACA

