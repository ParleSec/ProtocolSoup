  /scim/v2/Bulk:
    post:
      tags: [Bulk]
      summary: Execute bulk operations
      operationId: bulkOperations
      description: >-
        Each operation is performed as the single request it stands for, with
        the same checks. The response lists every processed operation with
        its status and location, and the error body of each that failed.
        A value "bulkId:{id}" in data or path is replaced with the id of the
        resource the POST operation with that bulkId created, whatever the
        order of the operations. failOnErrors stops the job after that many
        errors.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/BulkRequest"
      responses:
        "200":
          description: Bulk response payload.
          content:
            application/scim+json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid bulk payload.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "413":
          description: >-
            More than 1000 operations, or a body over 1048576 bytes. The error
            names the limit exceeded (RFC 7644 Section 3.7.4).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
