          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: Group not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    delete:
      tags: [Groups]
      summary: Delete group
      operationId: deleteGroup
      parameters:
        - in: header
          name: If-Match
          schema:
            type: string
          description: >-
            Entity-tag the resource must still have for the change to be made.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Group deleted.
        "412":
          description: >-
            The If-Match entity-tag is not the resource's current version (RFC
            7644 Section 3.14). Nothing was changed.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
