openapi: 3.1.0
info:
  title: ProtocolSoup SCIM API
  version: 1.0.0
  summary: SCIM 2.0 user and group provisioning endpoints.
  description: |
    Public contract for the ProtocolSoup SCIM service.
    Implements RFC 7642/7643/7644 style resource provisioning and discovery.

    The service provider is an OAuth 2.0 protected resource (RFC 7644 Section
    2). Every endpoint under /scim except GET /scim/v2/ServiceProviderConfig
    requires a bearer access token (RFC 6750) issued by the authorization
    server at /oauth2 for the SCIM base URI: scope scim.read to retrieve,
    scim.write to create, modify or delete. A refused request carries a
    WWW-Authenticate Bearer challenge.

    Responses are application/scim+json. A client that sends "Accept:
    application/json" and not application/scim+json gets the same JSON
    labelled application/json (RFC 7644 Section 3.8).
servers:
  - url: https://protocolsoup.com
    description: Production SCIM service
security: []
tags:
  - name: Query
    description: Queries across resource types and POST queries.
  - name: Health
    description: Service health and API index endpoints.
  - name: Discovery
    description: SCIM discovery resources.
  - name: Users
    description: SCIM user lifecycle operations.
  - name: Groups
    description: SCIM group lifecycle operations.
  - name: Bulk
    description: SCIM bulk and search operations.
  - name: Client
    description: Authenticated outbound SCIM provisioning operations.
paths:
  /health:
    get:
      tags: [Health]
      summary: Get service health
      operationId: getScimHealth
      responses:
        "200":
          description: Health payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api:
    get:
      tags: [Health]
      summary: Get API index
      operationId: getScimApiIndex
      responses:
        "200":
          description: API index payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndexResponse"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /scim/v2/ServiceProviderConfig:
    get:
      tags: [Discovery]
      summary: Get service provider capabilities
      operationId: getServiceProviderConfig
      description: >-
        Needs no access token. RFC 7643 Section 5 has the service provider
        make authenticationSchemes readable without prior authentication.
      security: []
      responses:
        "200":
          description: SCIM service provider configuration.
          content:
            application/scim+json:
              schema:
                type: object
                additionalProperties: true
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/ResourceTypes:
    get:
      tags: [Discovery]
      summary: List resource types
      operationId: listResourceTypes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource type list.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
  /scim/v2/ResourceTypes/{id}:
    get:
      tags: [Discovery]
      summary: Get resource type by ID
      operationId: getResourceType
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource type descriptor.
          content:
            application/scim+json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: Resource type not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
  /scim/v2/Schemas:
    get:
      tags: [Discovery]
      summary: List SCIM schemas
      operationId: listSchemas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Schema list.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
  /scim/v2/Schemas/{id}:
    get:
      tags: [Discovery]
      summary: Get schema by ID
      operationId: getSchema
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema descriptor.
          content:
            application/scim+json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: Schema not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
  /scim/v2/Users:
    get:
      tags: [Users]
      summary: List or filter users
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/StartIndex"
        - $ref: "#/components/parameters/Count"
        - $ref: "#/components/parameters/Attributes"
        - $ref: "#/components/parameters/ExcludedAttributes"
      responses:
        "200":
          description: User list response.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
              examples:
                users:
                  value:
                    schemas:
                      - urn:ietf:params:scim:api:messages:2.0:ListResponse
                    totalResults: 1
                    startIndex: 1
                    itemsPerPage: 1
                    Resources:
                      - id: "2819c223-7f76-453a-919d-413861904646"
                        userName: "alice@example.com"
                        active: true
        "400":
          description: Invalid filter or request parameters.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    post:
      tags: [Users]
      summary: Create user
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
            examples:
              create:
                value:
                  schemas:
                    - urn:ietf:params:scim:schemas:core:2.0:User
                  userName: "newuser@example.com"
                  name:
                    givenName: "New"
                    familyName: "User"
                  emails:
                    - value: "newuser@example.com"
                      primary: true
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "201":
          description: >-
            User created. The service provider issues id and meta; an id, meta
            or groups in the request is ignored (RFC 7644 Section 3.3).
          headers:
            Location:
              description: The URI of the created User, equal to meta.location (RFC 7644 Section 3.3).
              schema:
                type: string
                format: uri
            Content-Location:
              description: Equal to meta.location (RFC 7643 Section 3.1).
              schema:
                type: string
                format: uri
            ETag:
              description: Weak entity-tag, equal to meta.version (RFC 7644 Section 3.14).
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: >-
            Invalid user payload. scimType is invalidValue when schemas or
            userName is missing or the userName cannot be prepared for
            comparison (RFC 7644 Section 5), and invalidSyntax when schemas
            names a schema the User resource type does not define, repeats a
            value, or omits the schema of the attributes sent.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "409":
          description: >-
            Another User has this userName, compared without regard to case
            (RFC 7643 Section 4.1.1). scimType is uniqueness.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
  /scim/v2/Users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: If-None-Match
          schema:
            type: string
          description: >-
            Entity-tag of the representation the client holds. When it matches
            the current one the response is 304 (RFC 7644 Section 3.14).
      responses:
        "200":
          description: User resource.
          headers:
            Content-Location:
              description: Equal to meta.location (RFC 7643 Section 3.1).
              schema:
                type: string
                format: uri
            ETag:
              description: Weak entity-tag, equal to meta.version (RFC 7644 Section 3.14).
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "304":
          description: The User has not changed since the entity-tag in If-None-Match. No body.
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: User not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    put:
      tags: [Users]
      summary: Replace user
      operationId: replaceUser
      parameters:
        - in: header
          name: If-Match
          schema:
            type: string
          description: >-
            Entity-tag the resource must still have for the change to be made.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "200":
          description: Replaced user.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Invalid request payload.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          description: >-
            The If-Match entity-tag is not the resource's current version (RFC
            7644 Section 3.14). Nothing was changed.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: User not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    patch:
      tags: [Users]
      summary: Patch user attributes
      operationId: patchUser
      parameters:
        - in: header
          name: If-Match
          schema:
            type: string
          description: >-
            Entity-tag the resource must still have for the change to be made.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/PatchOpRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Invalid patch request.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          description: >-
            The If-Match entity-tag is not the resource's current version (RFC
            7644 Section 3.14). Nothing was changed.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "404":
          description: User not found.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      parameters:
        - in: header
          name: If-Match
          schema:
            type: string
          description: >-
            Entity-tag the resource must still have for the change to be made.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User deleted.
        "412":
          description: >-
            The If-Match entity-tag is not the resource's current version (RFC
            7644 Section 3.14). Nothing was changed.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
