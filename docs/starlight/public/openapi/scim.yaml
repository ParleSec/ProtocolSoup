  /scim/client/provision:
    post:
      tags: [Client]
      summary: Provision a single user to an external SCIM service
      description: |
        Sends one CreateUser request to the target's exact SCIM base URL. Server-managed
        attributes (id, meta, groups, password) are stripped before the request is sent;
        the source id is preserved as externalId for correlation. This endpoint does not
        persist a source-to-target mapping; use /scim/client/sync for repeatable
        reconciliation across many users.
      operationId: provisionUserToExternalScimService
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProvisionRequest"
      responses:
        "200":
          description: The user was created on the target SCIM service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Invalid request, missing userName, or invalid target URL.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "502":
          description: The target SCIM service rejected the request or returned an invalid response.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
  /scim/client/sync:
    post:
      tags: [Client]
      summary: Reconcile local users to an external SCIM service
      description: |
        Discovers the target ServiceProviderConfig and performs a one-way reconciliation.
        New users are created and previously mapped users are replaced with PUT. Successful
        source-to-target ID mappings are persisted for later runs. Remote users are never
        deleted implicitly; deprovisioning requires an explicit policy.
      operationId: syncUsersToExternalScimService
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSyncRequest"
      responses:
        "200":
          description: Every source user was reconciled successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSyncResponse"
        "207":
          description: Reconciliation completed with one or more per-user failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSyncResponse"
        "400":
          description: Invalid request or target URL.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: >-
            No bearer access token, or one that failed validation (expired,
            revoked, wrong iss or aud). WWW-Authenticate carries the Bearer
            challenge of RFC 6750 Section 3.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "403":
          description: >-
            The access token does not grant the scope the request needs.
            WWW-Authenticate carries error="insufficient_scope" and that scope.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "502":
          description: Target discovery or SCIM operations could not be completed.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
components:
  parameters:
    Filter:
      in: query
      name: filter
      schema:
        type: string
      description: >-
        Filter expression (RFC 7644 Section 3.4.2.2): the operators eq, ne,
        co, sw, ew, pr, gt, ge, lt and le, joined with and, or and not,
        grouped with round brackets, and value filters in square brackets
        such as emails[type eq "work" and value co "@example.com"]. An
        attribute may carry its schema URI. Comparison follows the
        attribute's type and caseExact. An invalid filter gets 400 with
        scimType invalidFilter.
      example: userName eq "alice@example.com"
    SortBy:
      in: query
      name: sortBy
      schema:
        type: string
      description: >-
        Attribute to order by, in attribute notation such as name.familyName
        (RFC 7644 Section 3.4.2.3). A multi-valued attribute sorts by its
        primary value, or else its first. Resources with no value come last
        when ascending and first when descending.
    SortOrder:
      in: query
      name: sortOrder
      schema:
        type: string
        enum: [ascending, descending]
        default: ascending
    StartIndex:
      in: query
      name: startIndex
      schema:
        type: integer
        default: 1
      description: 1-based index of the first result. A value less than 1 is read as 1.
    Count:
      in: query
      name: count
      schema:
        type: integer
      description: >-
        Most results to return in the page. 0 returns totalResults and no
        resources; a negative value is read as 0. The service provider
        returns at most 200, and that many when count is absent.
    Attributes:
      in: query
      name: attributes
      schema:
        type: string
      description: >-
        Comma-separated attribute names to return, with id and schemas, which
        are always returned (RFC 7644 Section 3.9). Sub-attributes may be
        named, as in name.givenName. Mutually exclusive with
        excludedAttributes.
      example: userName,name.givenName
    ExcludedAttributes:
      in: query
      name: excludedAttributes
      schema:
        type: string
      description: >-
        Comma-separated attribute names to leave out of the default set. It
        has no effect on id and schemas.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OAuth 2.0 access token (RFC 9068) from POST /oauth2/token, for example
        with grant_type=client_credentials as the seeded client scim-client.
        Its aud is the SCIM base URI. Scope scim.read authorizes GET and POST
        /scim/v2/.search; scim.write authorizes every other method.
  schemas:
    ScimSearchRequest:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:api:messages:2.0:SearchRequest
        filter:
          type: string
        sortBy:
          type: string
        sortOrder:
          type: string
          enum: [ascending, descending]
        startIndex:
          type: integer
        count:
          type: integer
        attributes:
          type: array
          items:
            type: string
        excludedAttributes:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [status, version, protocols, plugins]
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
          example: 1.0.0
        protocols:
          type: array
          items:
            type: string
          example: [scim]
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginHealth"
    PluginHealth:
      type: object
      required: [plugin_id, state, healthy]
      properties:
        plugin_id:
          type: string
        state:
          type: string
          enum: [uninitialized, initializing, ready, shutting_down, stopped, error]
        healthy:
          type: boolean
        error:
          type: string
    ClientProvisionRequest:
      type: object
      required: [targetUrl, user]
      properties:
        targetUrl:
          type: string
          format: uri
          description: Exact base URL of the target SCIM service, such as https://app.example.com/scim/v2.
        authToken:
          type: string
          writeOnly: true
          description: Bearer token sent only to the target SCIM service.
        user:
          $ref: "#/components/schemas/ScimUser"
    ClientSyncRequest:
      type: object
      required: [targetUrl]
      properties:
        targetUrl:
          type: string
          format: uri
          description: Exact base URL of the target SCIM service, such as https://app.example.com/scim/v2.
        authToken:
          type: string
          writeOnly: true
          description: Bearer token sent only to the target SCIM service.
    ClientSyncResponse:
      type: object
      required: [status, targetUrl, startedAt, completedAt, sourceUserCount, result]
      properties:
        status:
          type: string
          enum: [completed, partial]
        targetUrl:
          type: string
          format: uri
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        sourceUserCount:
          type: integer
          minimum: 0
        lastSuccessfulSync:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/ClientSyncResult"
    ClientSyncResult:
      type: object
      required: [created, updated, deleted, errors, mappings]
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
          description: Always zero because this endpoint does not infer deprovisioning.
        errors:
          type: integer
          minimum: 0
        mappings:
          type: object
          additionalProperties:
            type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ClientSyncOperation"
    ClientSyncOperation:
      type: object
      required: [localId, operation, status]
      properties:
        localId:
          type: string
        remoteId:
          type: string
        operation:
          type: string
          enum: [create, update]
        status:
          type: string
          enum: [success, error]
        error:
          type: string
    ApiIndexResponse:
      type: object
      required: [service, version, protocols, endpoints]
      properties:
        service:
          type: string
        version:
          type: string
        protocols:
          type: array
          items:
            type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
    ScimListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:api:messages:2.0:ListResponse
        totalResults:
          type: integer
          minimum: 0
        startIndex:
          type: integer
          minimum: 1
        itemsPerPage:
          type: integer
          minimum: 0
        Resources:
          type: array
          items:
            type: object
            additionalProperties: true
    ScimUser:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        userName:
          type: string
        active:
          type: boolean
        name:
          type: object
          properties:
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              type:
                type: string
              primary:
                type: boolean
        meta:
          type: object
          additionalProperties: true
    ScimGroup:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        displayName:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                description: Member resource ID
              display:
                type: string
                description: Member display name
              uri:
                type: string
                description: URI reference to the member resource (SCIM `$ref` field)
        meta:
          type: object
          additionalProperties: true
    PatchOpRequest:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [add, replace, remove]
              path:
                type: string
              value:
                oneOf:
                  - type: object
                    additionalProperties: true
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
                  - type: string
                  - type: number
                  - type: boolean
                  - type: "null"
    BulkRequest:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:api:messages:2.0:BulkRequest
        failOnErrors:
          type: integer
          minimum: 0
        Operations:
          type: array
          items:
            type: object
            required: [method, path]
            properties:
              method:
                type: string
                enum: [POST, PUT, PATCH, DELETE]
              path:
                type: string
              bulkId:
                type: string
              data:
                type: object
                additionalProperties: true
    ScimError:
      type: object
      required: [schemas, detail, status]
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:api:messages:2.0:Error
        detail:
          type: string
        status:
          type: string
        scimType:
          type: string
